<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-label="图书封面：RISC-V 处理器设计入门，从指令集到五级流水线">
  <title>图书封面：RISC-V 处理器设计入门，从指令集到五级流水线</title>
  <desc>白色封面，顶部红色丛书标识，中央一只手绘风格的红色毛毛虫，五节身体分别写着 IF、ID、EX、MEM、WB，头前方有一片写着 RV32I 的叶子，下方为书名、作者与单位。</desc>

  <style>
    .zh { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
  </style>

  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#EDEAE4"/>
    </pattern>
  </defs>

  <!-- 封面底色 -->
  <rect x="0" y="0" width="640" height="900" fill="#FFFFFF"/>
  <rect x="0" y="70" width="640" height="522" fill="url(#grid)"/>

  <!-- 顶部丛书标识 -->
  <rect x="0" y="0" width="640" height="70" fill="#C8102E"/>
  <rect x="32" y="18" width="34" height="34" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="49" y="43" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#FFFFFF">R</text>
  <text x="80" y="45" class="zh" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="1">计算机体系结构丛书</text>
  <text x="608" y="43" text-anchor="end" class="mono" font-size="12" fill="#FFD9DE" letter-spacing="2">ARCHITECTURE SERIES</text>

  <!-- 背景：淡淡的电路走线 -->
  <g fill="none" stroke="#E7E4DF" stroke-width="3">
    <path d="M -10 190 H 120 L 150 220 H 250"/>
    <path d="M -10 470 H 90 L 120 440 H 210"/>
    <path d="M 430 520 H 500 L 530 490 H 650"/>
  </g>
  <g fill="#D9D5CE">
    <circle cx="150" cy="220" r="5"/>
    <circle cx="120" cy="440" r="5"/>
    <circle cx="530" cy="490" r="5"/>
  </g>

  <!-- 图注：向经典动物封面致意 -->
  <text x="32" y="116" class="mono" font-size="13" font-style="italic" fill="#9A958D">Eruca pipelineus elementaria</text>

  <!-- 脚步：先画在身体下面 -->
  <g fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linecap="round">
    <path d="M 160 412 L 150 434 M 192 414 L 200 436"/>
    <path d="M 232 422 L 220 444 M 264 424 L 274 446"/>
    <path d="M 304 426 L 292 448 M 336 426 L 346 448"/>
    <path d="M 376 422 L 364 444 M 408 420 L 418 442"/>
    <path d="M 448 412 L 436 434 M 480 410 L 490 432"/>
  </g>

  <!-- 尾巴 -->
  <path d="M 140 372 C 112 370 96 352 88 338" fill="none" stroke="#1F1F1F" stroke-width="14" stroke-linecap="round"/>
  <path d="M 140 372 C 112 370 96 352 88 338" fill="none" stroke="#C8102E" stroke-width="8" stroke-linecap="round"/>

  <!-- 五节身体：流水线站点 -->
  <g fill="#C8102E" stroke="#1F1F1F" stroke-width="5">
    <circle cx="176" cy="372" r="43"/>
    <circle cx="248" cy="382" r="43"/>
    <circle cx="320" cy="386" r="43"/>
    <circle cx="392" cy="382" r="43"/>
    <circle cx="464" cy="372" r="43"/>
  </g>
  <g text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#FFFFFF">
    <text x="176" y="378">IF</text>
    <text x="248" y="388">ID</text>
    <text x="320" y="392">EX</text>
    <text x="392" y="388">MEM</text>
    <text x="464" y="378">WB</text>
  </g>

  <!-- 头部 -->
  <circle cx="548" cy="350" r="52" fill="#C8102E" stroke="#1F1F1F" stroke-width="5"/>
  <path d="M 532 306 Q 516 288 510 274" fill="none" stroke="#1F1F1F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 566 306 Q 582 288 588 274" fill="none" stroke="#1F1F1F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="508" cy="270" r="7" fill="#C8102E" stroke="#1F1F1F" stroke-width="3"/>
  <circle cx="590" cy="270" r="7" fill="#C8102E" stroke="#1F1F1F" stroke-width="3"/>

  <!-- 眼睛与表情 -->
  <ellipse cx="529" cy="344" rx="14" ry="17" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3"/>
  <ellipse cx="568" cy="344" rx="14" ry="17" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="3"/>
  <circle cx="533" cy="348" r="7" fill="#1F1F1F"/>
  <circle cx="564" cy="348" r="7" fill="#1F1F1F"/>
  <circle cx="536" cy="344" r="2.5" fill="#FFFFFF"/>
  <circle cx="567" cy="344" r="2.5" fill="#FFFFFF"/>
  <path d="M 536 377 Q 549 390 562 377" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linecap="round"/>

  <!-- 叶子：指令流 -->
  <g transform="rotate(-18 566 236)">
    <path d="M 512 244 Q 540 202 596 214 Q 586 268 530 266 Q 518 260 512 244 Z"
          fill="#6B9E58" stroke="#1F1F1F" stroke-width="4"/>
    <path d="M 520 250 Q 554 238 588 220" fill="none" stroke="#3F6B33" stroke-width="3" stroke-linecap="round"/>
    <text x="555" y="250" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#FFFFFF">RV32I</text>
  </g>

  <!-- 五个中文站点名 -->
  <g text-anchor="middle" class="zh" font-size="14" fill="#777169">
    <text x="176" y="466">取指</text>
    <text x="248" y="466">译码</text>
    <text x="320" y="466">执行</text>
    <text x="392" y="466">访存</text>
    <text x="464" y="466">写回</text>
  </g>
  <path d="M 132 482 H 508" stroke="#E0DDD7" stroke-width="2"/>

  <!-- 书名 -->
  <text x="32" y="656" class="zh" font-size="44" font-weight="800" fill="#1A1A1A">RISC-V 处理器设计入门</text>
  <text x="32" y="720" class="zh" font-size="38" font-weight="700" fill="#C8102E">从指令集到五级流水线</text>

  <!-- 作者与定位 -->
  <text x="32" y="788" class="zh" font-size="22" fill="#222222">邢建国　著</text>
  <text x="32" y="820" class="zh" font-size="16" fill="#666666">浙江工商大学</text>
  <text x="32" y="862" class="zh" font-size="14" fill="#777777">面向数字逻辑与程序设计基础的读者</text>
  <text x="608" y="862" text-anchor="end" class="zh" font-size="13" fill="#888888">配套代码与实验见 GitHub</text>
</svg>
