<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 6-4　指令字段的位置与立即数拼接</title>
  <desc>上半部分给出 32 位指令中各字段的固定位置，下半部分列出 I、S、B、U、J 五种立即数如何拼接并符号扩展。</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 6-4　指令字段的位置与立即数拼接</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">字段位置固定，译码函数就是几个移位加掩码</text>

  <g text-anchor="middle" font-size="11.5">
    <rect x="40" y="100" width="175" height="52" rx="5" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.4"/>
    <text x="127" y="123" fill="#7a2020">funct7</text>
    <text x="127" y="142" font-size="10.5" fill="#7a2020">inst[31:25]</text>

    <rect x="220" y="100" width="88" height="52" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="264" y="123" fill="#7a4f00">rs2</text>
    <text x="264" y="142" font-size="10.5" fill="#7a4f00">[24:20]</text>

    <rect x="313" y="100" width="88" height="52" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="357" y="123" fill="#7a4f00">rs1</text>
    <text x="357" y="142" font-size="10.5" fill="#7a4f00">[19:15]</text>

    <rect x="406" y="100" width="88" height="52" rx="5" fill="#EDECE8" stroke="#6b6b68" stroke-width="1.4"/>
    <text x="450" y="123" fill="#3a3a38">funct3</text>
    <text x="450" y="142" font-size="10.5" fill="#3a3a38">[14:12]</text>

    <rect x="499" y="100" width="88" height="52" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="543" y="123" fill="#0C447C">rd</text>
    <text x="543" y="142" font-size="10.5" fill="#0C447C">[11:7]</text>

    <rect x="592" y="100" width="268" height="52" rx="5" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.4"/>
    <text x="726" y="123" fill="#2d5c43">opcode</text>
    <text x="726" y="142" font-size="10.5" fill="#2d5c43">inst[6:0]</text>
  </g>
  <text x="40" y="178" font-size="11.5" fill="#5F5E5A">硬件设计里 rs1、rs2、rd、funct3 位置基本不动，只有立即数被拆散摆放</text>

  <g font-size="12" fill="#3a3a38">
    <rect x="40" y="205" width="820" height="38" rx="5" fill="#F7F7F5" stroke="#D1D5DB"/>
    <text x="58" y="229" font-weight="bold" fill="#1f2937">格式</text>
    <text x="150" y="229" font-weight="bold" fill="#1f2937">立即数的拼法</text>
    <text x="690" y="229" font-weight="bold" fill="#1f2937">符号位</text>

    <rect x="40" y="245" width="820" height="34" rx="5" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="58" y="267">I</text>
    <text x="150" y="267" font-family="Consolas,monospace">imm[11:0] = inst[31:20]</text>
    <text x="690" y="267">bit 31</text>

    <rect x="40" y="281" width="820" height="34" rx="5" fill="#FAFAF9" stroke="#E5E7EB"/>
    <text x="58" y="303">S</text>
    <text x="150" y="303" font-family="Consolas,monospace">imm[11:5]=inst[31:25]，imm[4:0]=inst[11:7]</text>
    <text x="690" y="303">bit 31</text>

    <rect x="40" y="317" width="820" height="34" rx="5" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="58" y="339">B</text>
    <text x="150" y="339" font-family="Consolas,monospace">12 11 10:5 4:1 分别取自 31、7、25:30、8:11，末位补 0</text>
    <text x="690" y="339">bit 12</text>

    <rect x="40" y="353" width="820" height="34" rx="5" fill="#FAFAF9" stroke="#E5E7EB"/>
    <text x="58" y="375">U</text>
    <text x="150" y="375" font-family="Consolas,monospace">imm[31:12]=inst[31:12]，低 12 位填 0</text>
    <text x="690" y="375">不扩展</text>

    <rect x="40" y="389" width="820" height="34" rx="5" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="58" y="411">J</text>
    <text x="150" y="411" font-family="Consolas,monospace">20 19:12 11 10:1 分别取自 31、12:19、20、21:30，末位补 0</text>
    <text x="690" y="411">bit 20</text>
  </g>

  <text x="40" y="451" font-size="11.5" fill="#5F5E5A">sext(value, bits) 检查最高位，为 1 就减去 2 的 bits 次方，得到 Python 里的负数</text>
</svg>
