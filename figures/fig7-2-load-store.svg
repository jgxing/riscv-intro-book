<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 7-2　访存指令的宽度与符号扩展</title>
  <desc>load 按 funct3 决定读字节、半字或字，lb 与 lh 要做符号扩展；store 按 funct3 决定写几个字节，地址由 rs1 加偏移得到。</desc>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 7-2　访存指令的宽度与符号扩展</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">地址算一次，宽度和扩展方式由 funct3 决定</text>

  <rect x="35" y="100" width="405" height="280" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
  <text x="55" y="128" font-size="14" font-weight="bold" fill="#0C447C">load　从内存读到寄存器</text>
  <g font-size="12" fill="#3a3a38">
    <text x="55" y="160" font-family="Consolas,monospace">addr = regs[rs1] + imm</text>
    <text x="55" y="192" font-family="Consolas,monospace">lb   ← bus.load8   + sext(8)</text>
    <text x="55" y="220" font-family="Consolas,monospace">lbu  ← bus.load8   + 零扩展</text>
    <text x="55" y="248" font-family="Consolas,monospace">lh   ← bus.load16  + sext(16)</text>
    <text x="55" y="276" font-family="Consolas,monospace">lhu  ← bus.load16  + 零扩展</text>
    <text x="55" y="304" font-family="Consolas,monospace">lw   ← bus.load32</text>
  </g>
  <text x="55" y="345" font-size="11.5" fill="#5F5E5A">只有 lb 和 lh 需要符号扩展，</text>
  <text x="55" y="365" font-size="11.5" fill="#5F5E5A">sext 在第 6 章就写好了，这里直接复用</text>

  <rect x="470" y="100" width="395" height="280" rx="8" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.6"/>
  <text x="490" y="128" font-size="14" font-weight="bold" fill="#7a4f00">store　从寄存器写到内存</text>
  <g font-size="12" fill="#3a3a38">
    <text x="490" y="160" font-family="Consolas,monospace">addr = regs[rs1] + imm</text>
    <text x="490" y="192" font-family="Consolas,monospace">sb   → bus.store8(addr, value)</text>
    <text x="490" y="220" font-family="Consolas,monospace">sh   → bus.store16(addr, value)</text>
    <text x="490" y="248" font-family="Consolas,monospace">sw   → bus.store32(addr, value)</text>
  </g>
  <text x="490" y="293" font-size="11.5" fill="#5F5E5A">写入时只取低位的 1、2 或 4 字节，</text>
  <text x="490" y="313" font-size="11.5" fill="#5F5E5A">总线按小端顺序拆分</text>
  <text x="490" y="348" font-size="11.5" fill="#5F5E5A">地址若落在 0x10000000 段，</text>
  <text x="490" y="368" font-size="11.5" fill="#5F5E5A">总线会把它转给 UART</text>
</svg>
