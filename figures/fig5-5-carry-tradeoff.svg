<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 5-5　串行进位与超前进位的取舍</title>
  <desc>串行进位面积小但进位逐级传递，关键路径长；超前进位用更多门电路提前算出各级进位，换取更短的关键路径。</desc>
  <rect x="0" y="0" width="900" height="370" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-5　串行进位与超前进位的取舍</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">同样的加法功能，进位怎么传，决定了面积和速度的走向</text>

  <rect x="30" y="95" width="405" height="225" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="50" y="123" font-size="15" font-weight="bold" fill="#0C447C">串行进位</text>

  <g text-anchor="middle">
    <rect x="55" y="165" width="55" height="40" rx="5" fill="#ffffff" stroke="#185FA5" stroke-width="1.4"/>
    <text x="82" y="191" font-size="12" fill="#0C447C">FA0</text>
    <rect x="130" y="165" width="55" height="40" rx="5" fill="#ffffff" stroke="#185FA5" stroke-width="1.4"/>
    <text x="157" y="191" font-size="12" fill="#0C447C">FA1</text>
    <rect x="205" y="165" width="55" height="40" rx="5" fill="#ffffff" stroke="#185FA5" stroke-width="1.4"/>
    <text x="232" y="191" font-size="12" fill="#0C447C">FA2</text>
    <rect x="280" y="165" width="55" height="40" rx="5" fill="#ffffff" stroke="#185FA5" stroke-width="1.4"/>
    <text x="307" y="191" font-size="12" fill="#0C447C">FA3</text>
  </g>
  <g stroke="#A32D2D" stroke-width="1.8" marker-end="url(#c)">
    <line x1="110" y1="185" x2="128" y2="185"/>
    <line x1="185" y1="185" x2="203" y2="185"/>
    <line x1="260" y1="185" x2="278" y2="185"/>
  </g>
  <rect x="55" y="245" width="280" height="20" rx="4" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1"/>
  <text x="195" y="260" font-size="11" fill="#7a2020" text-anchor="middle">关键路径：31 级进位链</text>
  <text x="50" y="297" font-size="12" fill="#3a3a38">门数少，布线简单；位宽越大越慢。</text>

  <rect x="465" y="95" width="405" height="225" rx="8" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
  <text x="485" y="123" font-size="15" font-weight="bold" fill="#7a4f00">超前进位</text>

  <g text-anchor="middle">
    <rect x="490" y="165" width="75" height="40" rx="5" fill="#ffffff" stroke="#BA7517" stroke-width="1.4"/>
    <text x="527" y="191" font-size="12" fill="#7a4f00">生成/传播</text>
    <rect x="600" y="165" width="100" height="40" rx="5" fill="#ffffff" stroke="#BA7517" stroke-width="1.4"/>
    <text x="650" y="191" font-size="12" fill="#7a4f00">进位网络</text>
    <rect x="735" y="165" width="105" height="40" rx="5" fill="#ffffff" stroke="#BA7517" stroke-width="1.4"/>
    <text x="787" y="191" font-size="12" fill="#7a4f00">各级求和</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#a)">
    <line x1="565" y1="185" x2="598" y2="185"/>
    <line x1="700" y1="185" x2="733" y2="185"/>
  </g>
  <rect x="490" y="245" width="120" height="20" rx="4" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1"/>
  <text x="550" y="260" font-size="11" fill="#2d5c43" text-anchor="middle">关键路径：约 4 级门</text>
  <text x="485" y="297" font-size="12" fill="#3a3a38">门数多，面积大；高位宽时速度优势明显。</text>

  <text x="30" y="350" font-size="12" fill="#5F5E5A">本书采用串行进位实现骨架，先求正确，再看第 15 章如何分析它带来的瓶颈。</text>

  <defs>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#A32D2D"/>
    </marker>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
