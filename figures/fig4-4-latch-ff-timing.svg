<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 4-4　D 锁存器与 D 触发器的时序差别</title>
  <desc>同样的时钟和数据波形下，锁存器在时钟为高期间跟随输入变化，触发器只在时钟上升沿采样一次。</desc>
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 4-4　D 锁存器与 D 触发器的时序差别</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">虚线标出上升沿，注意两种存储器件对同一段 d 波形的反应</text>

  <g stroke="#E4E2DB" stroke-width="1" stroke-dasharray="4 4">
    <line x1="200" y1="100" x2="200" y2="420"/>
    <line x1="360" y1="100" x2="360" y2="420"/>
    <line x1="520" y1="100" x2="520" y2="420"/>
    <line x1="680" y1="100" x2="680" y2="420"/>
  </g>

  <g font-size="13" fill="#3a3a38" font-weight="bold">
    <text x="35" y="150">clk</text>
    <text x="35" y="230">d</text>
    <text x="35" y="310">q 锁存器</text>
    <text x="35" y="390">q 触发器</text>
  </g>

  <path d="M160,160 L200,160 L200,130 L280,130 L280,160 L360,160 L360,130 L440,130 L440,160 L520,160 L520,130 L600,130 L600,160 L680,160 L680,130 L760,130 L760,160 L830,160"
        fill="none" stroke="#185FA5" stroke-width="2"/>
  <text x="845" y="160" font-size="11" fill="#185FA5">时钟</text>

  <path d="M160,240 L320,240 L320,210 L420,210 L420,240 L600,240 L600,210 L830,210"
        fill="none" stroke="#3B7A57" stroke-width="2"/>

  <path d="M160,320 L360,320 L360,290 L420,290 L420,320 L680,320 L680,290 L830,290"
        fill="none" stroke="#BA7517" stroke-width="2.4"/>
  <path d="M160,400 L360,400 L360,370 L520,370 L520,400 L680,400 L680,370 L830,370"
        fill="none" stroke="#A32D2D" stroke-width="2.4"/>

  <g font-size="11.5" fill="#7a4f00">
    <line x1="420" y1="290" x2="470" y2="335" stroke="#BA7517" stroke-width="1"/>
    <text x="470" y="350">高电平期间 d 一变，输出立刻跟着变</text>
  </g>
  <g font-size="11.5" fill="#7a2020">
    <line x1="680" y1="370" x2="665" y2="415" stroke="#A32D2D" stroke-width="1"/>
    <text x="560" y="432">只在上升沿采样，其余时间保持原值</text>
  </g>

  <text x="30" y="452" font-size="11.5" fill="#5F5E5A">高电平区间：200~280、360~440、520~600、680~760</text>
</svg>
