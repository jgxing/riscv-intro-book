<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 4-6　Digital 与 Icarus Verilog 的分工</title>
  <desc>同一份电路功能可以用 Digital 的图形电路和 Verilog 文本两种形式描述，前者便于直观拨动开关，后者便于写测试台做批量检查。</desc>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 4-6　Digital 与 Icarus Verilog 的分工</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">两种描述，一份行为；先看懂电路，再学会让机器替你检查</text>

  <rect x="335" y="95" width="230" height="60" rx="8" fill="#EDECE8" stroke="#9CA3AF" stroke-width="1.4"/>
  <text x="450" y="120" font-size="14" font-weight="bold" fill="#3a3a38" text-anchor="middle">同一个电路功能</text>
  <text x="450" y="141" font-size="11" fill="#5F5E5A" text-anchor="middle">比如带使能的 D 触发器</text>

  <g text-anchor="middle">
    <rect x="80" y="215" width="290" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="225" y="245" font-size="14" font-weight="bold" fill="#0C447C">Digital 图形电路</text>
    <text x="225" y="271" font-size="12" fill="#3a3a38">.dig 文件，元件连线直接画出</text>
    <text x="225" y="294" font-size="12" fill="#3a3a38">拨开关、点时钟、看指示灯</text>
    <text x="225" y="317" font-size="12" fill="#3a3a38">适合建立"信号沿线走"的直觉</text>

    <rect x="530" y="215" width="290" height="120" rx="8" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.5"/>
    <text x="675" y="245" font-size="14" font-weight="bold" fill="#7a4f00">Verilog 文本描述</text>
    <text x="675" y="271" font-size="12" fill="#3a3a38">.v 文件，用代码描述行为</text>
    <text x="675" y="294" font-size="12" fill="#3a3a38">iverilog 编译，vvp 跑测试台</text>
    <text x="675" y="317" font-size="12" fill="#3a3a38">适合批量断言和重复回归</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="1.7" marker-end="url(#arrow)">
    <line x1="390" y1="155" x2="245" y2="210"/>
    <line x1="510" y1="155" x2="655" y2="210"/>
    <line x1="225" y1="335" x2="350" y2="363"/>
    <line x1="675" y1="335" x2="550" y2="363"/>
  </g>
  <rect x="290" y="365" width="320" height="40" rx="8" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.4"/>
  <text x="450" y="391" font-size="13" font-weight="bold" fill="#2d5c43" text-anchor="middle">互相印证：两种形式的结果应该一致</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
