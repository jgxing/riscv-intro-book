<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 11-2　特权模式与机器模式 CSR</title>
  <desc>机器模式是所有 RISC-V 处理器都必须实现的最高特权模式，异常处理用到的七个 CSR 都在这里。</desc>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 11-2　特权模式与机器模式 CSR</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">本书只实现机器模式，异常处理程序也只在这一层运行</text>

  <!-- 特权模式 -->
  <text x="30" y="100" font-size="14" font-weight="bold" fill="#1f2937">特权模式</text>
  <rect x="30" y="116" width="340" height="72" rx="6" fill="#DBEAFE" stroke="#185FA5" stroke-width="1.5"/>
  <text x="46" y="144" font-size="14" font-weight="bold" fill="#0B3D6E">M 模式　机器模式</text>
  <text x="46" y="168" font-size="11.5" fill="#374151">最高特权，必须实现；能访问全部 CSR</text>
  <rect x="60" y="204" width="310" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="76" y="230" font-size="13" fill="#4B5563">S 模式　监管模式（本书不实现）</text>
  <text x="76" y="251" font-size="11" fill="#6B7280">给类 Unix 操作系统使用</text>
  <rect x="90" y="280" width="280" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="106" y="306" font-size="13" fill="#4B5563">U 模式　用户模式（本书不实现）</text>
  <text x="106" y="327" font-size="11" fill="#6B7280">普通应用程序运行在这里</text>
  <text x="30" y="372" font-size="11.5" fill="#6B7280">处理器通常从低特权开始，遇到异常或中断才转到高特权。</text>
  <text x="30" y="394" font-size="11.5" fill="#6B7280">本书简化为只有 M 模式，省掉了模式切换的分支。</text>

  <!-- CSR 列表 -->
  <text x="410" y="100" font-size="14" font-weight="bold" fill="#1f2937">异常相关的七个 CSR</text>
  <rect x="410" y="116" width="460" height="324" rx="8" fill="#F5F3FF" stroke="#7E22CE" stroke-width="1.5"/>
  <text x="428" y="146" font-size="11.5" fill="#6B7280">地址</text>
  <text x="510" y="146" font-size="11.5" fill="#6B7280">名称</text>
  <text x="620" y="146" font-size="11.5" fill="#6B7280">作用</text>
  <line x1="428" y1="156" x2="852" y2="156" stroke="#C4B5FD"/>

  <text x="428" y="180" font-size="11.5" fill="#1f2937" font-family="monospace">0x300</text>
  <text x="510" y="180" font-size="11.5" fill="#1f2937" font-family="monospace">mstatus</text>
  <text x="620" y="180" font-size="11.5" fill="#374151">中断使能位 MIE 与保存位 MPIE</text>

  <text x="428" y="208" font-size="11.5" fill="#1f2937" font-family="monospace">0x304</text>
  <text x="510" y="208" font-size="11.5" fill="#1f2937" font-family="monospace">mie</text>
  <text x="620" y="208" font-size="11.5" fill="#374151">每一类中断各自的使能位</text>

  <text x="428" y="236" font-size="11.5" fill="#1f2937" font-family="monospace">0x305</text>
  <text x="510" y="236" font-size="11.5" fill="#1f2937" font-family="monospace">mtvec</text>
  <text x="620" y="236" font-size="11.5" fill="#374151">异常入口地址</text>

  <text x="428" y="264" font-size="11.5" fill="#1f2937" font-family="monospace">0x341</text>
  <text x="510" y="264" font-size="11.5" fill="#1f2937" font-family="monospace">mepc</text>
  <text x="620" y="264" font-size="11.5" fill="#374151">返回后接着执行的 PC</text>

  <text x="428" y="292" font-size="11.5" fill="#1f2937" font-family="monospace">0x342</text>
  <text x="510" y="292" font-size="11.5" fill="#1f2937" font-family="monospace">mcause</text>
  <text x="620" y="292" font-size="11.5" fill="#374151">陷入原因，最高位区分中断</text>

  <text x="428" y="320" font-size="11.5" fill="#1f2937" font-family="monospace">0x343</text>
  <text x="510" y="320" font-size="11.5" fill="#1f2937" font-family="monospace">mtval</text>
  <text x="620" y="320" font-size="11.5" fill="#374151">附加信息，如非法指令字</text>

  <text x="428" y="348" font-size="11.5" fill="#1f2937" font-family="monospace">0x344</text>
  <text x="510" y="348" font-size="11.5" fill="#1f2937" font-family="monospace">mip</text>
  <text x="620" y="348" font-size="11.5" fill="#374151">当前有哪些中断请求</text>

  <line x1="428" y1="366" x2="852" y2="366" stroke="#C4B5FD"/>
  <text x="428" y="392" font-size="11.5" fill="#B45309">规范里共有 4096 个 CSR 地址，本章只实现这七个。</text>
  <text x="428" y="416" font-size="11.5" fill="#6B7280">用 case 语句按地址译码就能读写，不必真的造一个大数组。</text>

  <text x="30" y="470" font-size="12.5" fill="#374151">mscratch 也是常用 CSR，供处理程序临时寄存一个通用寄存器，本章的简化版本没有实现它。</text>
</svg>
