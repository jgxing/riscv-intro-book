<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 13-2　从 C 源码到可运行镜像的工具链</title>
  <desc>main.c 经 gcc 编译成目标文件，ld 按链接脚本布局成 ELF，objcopy 抽出二进制镜像，最后装进模拟器或烧进硬件。</desc>
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 13-2　从 C 源码到可运行镜像的工具链</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">每一步的产出都可以拿工具查看，不必把编译当黑箱</text>

  <!-- 阶段框 -->
  <rect x="30" y="110" width="150" height="90" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="105" y="140" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">main.c</text>
  <text x="105" y="162" font-size="11" fill="#92400E" text-anchor="middle">start.S</text>
  <text x="105" y="182" font-size="10.5" fill="#B45309" text-anchor="middle">C 与汇编源码</text>

  <rect x="230" y="110" width="150" height="90" rx="8" fill="#DBEAFE" stroke="#185FA5" stroke-width="1.5"/>
  <text x="305" y="140" font-size="13" font-weight="bold" fill="#0B3D6E" text-anchor="middle">gcc 编译</text>
  <text x="305" y="162" font-size="11" font-family="monospace" fill="#1f2937" text-anchor="middle">-c</text>
  <text x="305" y="182" font-size="10.5" fill="#185FA5" text-anchor="middle">main.o</text>

  <rect x="430" y="110" width="150" height="90" rx="8" fill="#DBEAFE" stroke="#185FA5" stroke-width="1.5"/>
  <text x="505" y="140" font-size="13" font-weight="bold" fill="#0B3D6E" text-anchor="middle">ld 链接</text>
  <text x="505" y="162" font-size="11" font-family="monospace" fill="#1f2937" text-anchor="middle">-T link.ld</text>
  <text x="505" y="182" font-size="10.5" fill="#185FA5" text-anchor="middle">main.elf</text>

  <rect x="630" y="110" width="150" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="705" y="140" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">objcopy</text>
  <text x="705" y="162" font-size="11" font-family="monospace" fill="#1f2937" text-anchor="middle">-O binary</text>
  <text x="705" y="182" font-size="10.5" fill="#047857" text-anchor="middle">main.bin</text>

  <rect x="820" y="110" width="100" height="90" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="870" y="145" font-size="12" font-weight="bold" fill="#6B21A8" text-anchor="middle">装进</text>
  <text x="870" y="165" font-size="12" font-weight="bold" fill="#6B21A8" text-anchor="middle">模拟器</text>
  <text x="870" y="185" font-size="10.5" fill="#7C3AED" text-anchor="middle">或硬件</text>

  <!-- 箭头 -->
  <path d="M180 155 L228 155" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M380 155 L428 155" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M580 155 L628 155" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M780 155 L818 155" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 各步可查看 -->
  <text x="30" y="245" font-size="13" font-weight="bold" fill="#374151">每一步都能停下来看：</text>
  <rect x="30" y="260" width="890" height="100" rx="8" fill="#FAFAF9" stroke="#D6D3D1"/>

  <text x="48" y="288" font-size="11.5" font-family="monospace" fill="#1f2937">gcc -S</text>
  <text x="150" y="288" font-size="11.5" fill="#374151">看编译器生成的汇编</text>

  <text x="48" y="312" font-size="11.5" font-family="monospace" fill="#1f2937">readelf</text>
  <text x="150" y="312" font-size="11.5" fill="#374151">看 ELF 的段与入口地址</text>

  <text x="48" y="336" font-size="11.5" font-family="monospace" fill="#1f2937">objdump -d</text>
  <text x="150" y="336" font-size="11.5" fill="#374151">反汇编，核对每条 C 语句对应的指令</text>

  <text x="500" y="288" font-size="11.5" font-family="monospace" fill="#1f2937">make</text>
  <text x="600" y="288" font-size="11.5" fill="#374151">把以上步骤串成一条命令</text>

  <text x="500" y="312" font-size="11.5" font-family="monospace" fill="#1f2937">Python 演示</text>
  <text x="600" y="312" font-size="11.5" fill="#374151">本机没有工具链时走同一条概念链</text>

  <text x="30" y="386" font-size="12" fill="#6B7280">注：make 只是把多次命令按依赖顺序组织起来，Tab 缩进是它的语法要求。</text>
</svg>
