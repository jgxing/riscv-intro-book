<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 7-4　总线按地址分流到内存和 UART</title>
  <desc>CPU 的访存请求先进总线，0x80000000 段转给内存，0x10000000 段转给 UART，UART 只实现数据寄存器和线路状态寄存器。</desc>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 7-4　总线按地址分流到内存和 UART</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">外设寄存器也占地址，读写外设和读写内存用同一套指令</text>

  <rect x="45" y="105" width="160" height="62" rx="7" fill="#EDECE8" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="125" y="132" font-size="13.5" font-weight="bold" fill="#3a3a38" text-anchor="middle">CPU</text>
  <text x="125" y="153" font-size="11" fill="#5F5E5A" text-anchor="middle">load / store</text>

  <rect x="330" y="95" width="200" height="82" rx="7" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.8"/>
  <text x="430" y="124" font-size="14" font-weight="bold" fill="#7a4f00" text-anchor="middle">Bus 地址译码</text>
  <text x="430" y="148" font-size="11" fill="#3a3a38" text-anchor="middle">0x10000000 段 → UART</text>
  <text x="430" y="166" font-size="11" fill="#3a3a38" text-anchor="middle">0x80000000 段 → Memory</text>

  <rect x="630" y="100" width="220" height="70" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
  <text x="740" y="127" font-size="13.5" font-weight="bold" fill="#0C447C" text-anchor="middle">Memory</text>
  <text x="740" y="148" font-size="11" fill="#5F5E5A" text-anchor="middle">指令 + 数据 + 栈</text>

  <rect x="630" y="235" width="220" height="100" rx="7" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.6"/>
  <text x="740" y="262" font-size="13.5" font-weight="bold" fill="#2d5c43" text-anchor="middle">UART 0x10000000</text>
  <text x="740" y="286" font-size="11" fill="#3a3a38" text-anchor="middle">偏移 0：THR / RBR</text>
  <text x="740" y="306" font-size="11" fill="#3a3a38" text-anchor="middle">偏移 5：LSR</text>
  <text x="740" y="325" font-size="11" fill="#5F5E5A" text-anchor="middle">bit0 数据就绪 bit5 发送空</text>

  <g stroke="#6b6b68" stroke-width="1.7" fill="none">
    <path d="M205 136 L325 136" marker-end="url(#ar74)"/>
    <path d="M530 120 L625 135" marker-end="url(#ar74)"/>
    <path d="M530 155 C590 155 590 280 625 280" marker-end="url(#ar74)"/>
  </g>
  <defs>
    <marker id="ar74" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b6b68"/>
    </marker>
  </defs>

  <rect x="45" y="370" width="805" height="46" rx="6" fill="#FAFAF9" stroke="#D1D5DB"/>
  <text x="65" y="398" font-size="12" fill="#3a3a38">程序里一句 sw x3, 0(x5)，只要 x5 指向 0x10000000，字节就从串口出去</text>
</svg>
