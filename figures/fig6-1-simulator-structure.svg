<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 6-1　软件模拟器的三块结构</title>
  <desc>内存保存指令和数据，CPU 状态保存 pc 与 32 个寄存器，取指译码执行三部分顺序工作；本章实现到译码，执行留在下一章。</desc>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 6-1　软件模拟器的三块结构</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">用 list 和 bytearray 把一台计算机装进一个 Python 进程</text>

  <rect x="35" y="110" width="240" height="300" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
  <text x="155" y="142" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">内存 Memory</text>
  <text x="155" y="166" font-size="11.5" fill="#3a3a38" text-anchor="middle">bytearray，从 0x80000000 起</text>
  <rect x="60" y="190" width="190" height="46" rx="6" fill="#ffffff" stroke="#185FA5"/>
  <text x="155" y="218" font-size="12.5" fill="#0C447C" text-anchor="middle">指令 + 数据</text>
  <rect x="60" y="255" width="190" height="46" rx="6" fill="#ffffff" stroke="#185FA5"/>
  <text x="155" y="283" font-size="12.5" fill="#0C447C" text-anchor="middle">load32 / store32</text>
  <rect x="60" y="320" width="190" height="46" rx="6" fill="#ffffff" stroke="#185FA5"/>
  <text x="155" y="348" font-size="12.5" fill="#0C447C" text-anchor="middle">load_image</text>
  <text x="155" y="390" font-size="11" fill="#5F5E5A" text-anchor="middle">小端字节序</text>

  <rect x="340" y="110" width="220" height="300" rx="10" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.8"/>
  <text x="450" y="142" font-size="15" font-weight="bold" fill="#2d5c43" text-anchor="middle">CPU 状态 CPU</text>
  <rect x="368" y="180" width="164" height="52" rx="6" fill="#ffffff" stroke="#3B7A57"/>
  <text x="450" y="202" font-size="13" fill="#2d5c43" text-anchor="middle">pc</text>
  <text x="450" y="221" font-size="11" fill="#5F5E5A" text-anchor="middle">程序计数器</text>
  <rect x="368" y="258" width="164" height="84" rx="6" fill="#ffffff" stroke="#3B7A57"/>
  <text x="450" y="282" font-size="13" fill="#2d5c43" text-anchor="middle">regs[0..31]</text>
  <text x="450" y="304" font-size="11" fill="#5F5E5A" text-anchor="middle">整数寄存器堆</text>
  <text x="450" y="325" font-size="11" fill="#5F5E5A" text-anchor="middle">x0 恒为 0</text>
  <text x="450" y="390" font-size="11" fill="#5F5E5A" text-anchor="middle">get/set 接口挡住细节</text>

  <rect x="625" y="110" width="240" height="300" rx="10" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.8"/>
  <text x="745" y="142" font-size="15" font-weight="bold" fill="#7a4f00" text-anchor="middle">一条指令的处理</text>
  <rect x="655" y="178" width="180" height="52" rx="6" fill="#ffffff" stroke="#BA7517"/>
  <text x="745" y="199" font-size="13" fill="#7a4f00" text-anchor="middle">取指 fetch</text>
  <text x="745" y="218" font-size="11" fill="#5F5E5A" text-anchor="middle">按 pc 从内存读 32 位</text>
  <rect x="655" y="252" width="180" height="52" rx="6" fill="#ffffff" stroke="#BA7517"/>
  <text x="745" y="273" font-size="13" fill="#7a4f00" text-anchor="middle">译码 decode</text>
  <text x="745" y="292" font-size="11" fill="#5F5E5A" text-anchor="middle">拆字段、识别指令</text>
  <rect x="655" y="326" width="180" height="52" rx="6" fill="#F7F7F5" stroke="#9CA3AF" stroke-dasharray="5 4"/>
  <text x="745" y="347" font-size="13" fill="#6b6b68" text-anchor="middle">执行 execute</text>
  <text x="745" y="366" font-size="11" fill="#8A857E" text-anchor="middle">第 7 章补上</text>

  <g stroke="#6b6b68" stroke-width="1.7" fill="none">
    <path d="M275 205 L335 205" marker-end="url(#ar)"/>
    <path d="M560 205 L650 205" marker-end="url(#ar)"/>
    <path d="M745 230 L745 248" marker-end="url(#ar)"/>
    <path d="M745 304 L745 322" marker-end="url(#ar)" stroke-dasharray="4 3"/>
    <path d="M625 352 C560 352 560 430 455 430 C360 430 340 380 340 348" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b6b68"/>
    </marker>
  </defs>
  <text x="500" y="425" font-size="11" fill="#5F5E5A">执行后改 pc 或写寄存器</text>
  <text x="300" y="198" font-size="10.5" fill="#5F5E5A">读指令</text>

  <text x="30" y="465" font-size="11.5" fill="#5F5E5A">本章先把左边两块和中间的取指、译码做出来，执行部分用一个能打印结果的走通例子代替。</text>
</svg>
