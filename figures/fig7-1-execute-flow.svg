<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 7-1　一条指令从取指到改状态的过程</title>
  <desc>取指拿到 32 位指令字，译码拆出字段，执行按 kind 分发到处理函数，处理函数改寄存器、访问总线或算出下一条 pc，最后集中推进 pc。</desc>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 7-1　一条指令从取指到改状态的过程</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">pc 的推进只在一处做，分支和跳转只负责算出下一个地址</text>

  <g text-anchor="middle">
    <rect x="35" y="110" width="150" height="60" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
    <text x="110" y="135" font-size="13.5" fill="#0C447C">取指 fetch</text>
    <text x="110" y="155" font-size="11" fill="#5F5E5A">按 pc 读 32 位</text>

    <rect x="235" y="110" width="150" height="60" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
    <text x="310" y="135" font-size="13.5" fill="#0C447C">译码 decode</text>
    <text x="310" y="155" font-size="11" fill="#5F5E5A">拆字段、取立即数</text>

    <rect x="435" y="100" width="180" height="80" rx="7" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.6"/>
    <text x="525" y="127" font-size="13.5" font-weight="bold" fill="#7a4f00">execute</text>
    <text x="525" y="148" font-size="11" fill="#5F5E5A">按 d.kind 查 EXEC 表</text>
    <text x="525" y="166" font-size="11" fill="#5F5E5A">调用对应处理函数</text>

    <rect x="665" y="110" width="200" height="60" rx="7" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.6"/>
    <text x="765" y="135" font-size="13.5" fill="#2d5c43">改状态</text>
    <text x="765" y="155" font-size="11" fill="#5F5E5A">寄存器 / 内存 / pc</text>
  </g>

  <g stroke="#6b6b68" stroke-width="1.7" fill="none">
    <path d="M185 140 L230 140" marker-end="url(#ar7)"/>
    <path d="M385 140 L430 140" marker-end="url(#ar7)"/>
    <path d="M615 140 L660 140" marker-end="url(#ar7)"/>
  </g>
  <defs>
    <marker id="ar7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b6b68"/>
    </marker>
  </defs>

  <rect x="35" y="225" width="830" height="150" rx="8" fill="#FAFAF9" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="55" y="252" font-size="13" font-weight="bold" fill="#1f2937">处理函数只做三件事之一</text>

  <rect x="55" y="270" width="250" height="82" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.3"/>
  <text x="180" y="294" font-size="12.5" font-weight="bold" fill="#0C447C" text-anchor="middle">写寄存器</text>
  <text x="180" y="315" font-size="11" fill="#3a3a38" text-anchor="middle">lui、算术、load</text>
  <text x="180" y="333" font-size="11" fill="#3a3a38" text-anchor="middle">set_reg(rd, value)</text>

  <rect x="325" y="270" width="250" height="82" rx="6" fill="#ffffff" stroke="#3B7A57" stroke-width="1.3"/>
  <text x="450" y="294" font-size="12.5" font-weight="bold" fill="#2d5c43" text-anchor="middle">访问总线</text>
  <text x="450" y="315" font-size="11" fill="#3a3a38" text-anchor="middle">load、store</text>
  <text x="450" y="333" font-size="11" fill="#3a3a38" text-anchor="middle">bus.load / bus.store</text>

  <rect x="595" y="270" width="250" height="82" rx="6" fill="#ffffff" stroke="#BA7517" stroke-width="1.3"/>
  <text x="720" y="294" font-size="12.5" font-weight="bold" fill="#7a4f00" text-anchor="middle">给出下一个地址</text>
  <text x="720" y="315" font-size="11" fill="#3a3a38" text-anchor="middle">branch、jal、jalr</text>
  <text x="720" y="333" font-size="11" fill="#3a3a38" text-anchor="middle">返回 next_pc</text>
</svg>
