<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 1-1　软件、指令集与硬件三层关系</title>
  <desc>软件层通过编译和汇编翻译成指令序列，指令集是软件与硬件之间的边界，硬件层用电路实现指令行为。两侧标注写程序的人和做电路的人各自只需了解边界的一侧。</desc>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 1-1　软件、指令集与硬件三层关系</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">指令集是一条边界，两边可以各自变化</text>

  <!-- 软件层 -->
  <rect x="60" y="100" width="520" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="85" y="138" font-size="20" font-weight="bold" fill="#0C447C">软件层</text>
  <text x="85" y="170" font-size="15" fill="#2C2C2A">C / Python 程序，汇编程序</text>
  <text x="85" y="193" font-size="13" fill="#5F5E5A">关心的是：要完成什么任务</text>

  <!-- 向下箭头 -->
  <line x1="320" y1="212" x2="320" y2="246" stroke="#A32D2D" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="335" y="235" font-size="11.5" fill="#7a2020">编译 / 汇编：翻译成指令序列</text>

  <!-- 指令集层 -->
  <rect x="60" y="250" width="520" height="100" rx="8" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.8"/>
  <text x="85" y="292" font-size="20" font-weight="bold" fill="#7a2020">指令集 ISA</text>
  <text x="85" y="322" font-size="14.5" fill="#2C2C2A">指令、寄存器、寻址方式、跳转规则</text>

  <!-- 向上箭头 -->
  <line x1="320" y1="354" x2="320" y2="388" stroke="#3B7A57" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="335" y="377" font-size="11.5" fill="#2d5c43">电路实现：兑现每条指令的行为</text>

  <!-- 硬件层 -->
  <rect x="60" y="392" width="520" height="106" rx="8" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.4"/>
  <text x="85" y="430" font-size="20" font-weight="bold" fill="#2d5c43">硬件层</text>
  <text x="85" y="461" font-size="14.5" fill="#2C2C2A">取指 → 译码 → 执行 → 访存 → 写回</text>
  <text x="85" y="484" font-size="13" fill="#5F5E5A">关心的是：每个周期让哪些信号有效</text>

  <!-- 右侧说明 -->
  <rect x="620" y="100" width="240" height="110" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="640" y="130" font-size="14" font-weight="bold" fill="#0C447C">写程序的人</text>
  <text x="640" y="156" font-size="12.5" fill="#3a3a38">只需知道指令集</text>
  <text x="640" y="180" font-size="12.5" fill="#3a3a38">不必了解晶体管怎么开关</text>

  <rect x="620" y="250" width="240" height="100" rx="8" fill="#FAFAF8" stroke="#A32D2D" stroke-width="1.2"/>
  <text x="640" y="280" font-size="14" font-weight="bold" fill="#7a2020">同一条边界</text>
  <text x="640" y="306" font-size="12.5" fill="#3a3a38">指令集不变</text>
  <text x="640" y="330" font-size="12.5" fill="#3a3a38">实现可以完全不同</text>

  <rect x="620" y="392" width="240" height="106" rx="8" fill="#FAFAF8" stroke="#3B7A57" stroke-width="1.2"/>
  <text x="640" y="422" font-size="14" font-weight="bold" fill="#2d5c43">做电路的人</text>
  <text x="640" y="448" font-size="12.5" fill="#3a3a38">只需实现指令集</text>
  <text x="640" y="472" font-size="12.5" fill="#3a3a38">不必知道上层跑什么程序</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#A32D2D"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#3B7A57"/>
    </marker>
  </defs>
</svg>
