<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 11-1　异常与中断的区别</title>
  <desc>异常由正在执行的指令同步触发，中断由外部事件异步触发，两者走同一套陷入处理机制。</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 11-1　异常与中断的区别</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">触发的原因不同，保存现场和跳转处理的办法相同</text>

  <rect x="30" y="88" width="404" height="316" rx="8" fill="#EFF6FF" stroke="#185FA5" stroke-width="1.5"/>
  <rect x="30" y="88" width="404" height="46" rx="8" fill="#DBEAFE"/>
  <text x="46" y="118" font-size="15" font-weight="bold" fill="#0B3D6E">同步异常</text>
  <text x="46" y="158" font-size="12.5" fill="#374151">由当前这条指令直接引起，"踩到才发生"</text>
  <rect x="46" y="176" width="372" height="104" rx="5" fill="#ffffff" stroke="#93C5FD"/>
  <text x="60" y="198" font-size="11.5" fill="#1f2937" font-family="monospace">ecall        环境调用，mcause = 8</text>
  <text x="60" y="220" font-size="11.5" fill="#1f2937" font-family="monospace">ebreak       断点，mcause = 3</text>
  <text x="60" y="242" font-size="11.5" fill="#1f2937" font-family="monospace">非法指令     译码不认识，mcause = 2</text>
  <text x="60" y="264" font-size="11.5" fill="#1f2937" font-family="monospace">访存错误     地址或权限不对</text>
  <text x="46" y="310" font-size="12" fill="#374151">异常是精确的：</text>
  <text x="46" y="334" font-size="12" fill="#374151">异常点之前的指令都已完成，</text>
  <text x="46" y="356" font-size="12" fill="#374151">之后的指令一条也没执行。</text>
  <text x="46" y="384" font-size="12" font-weight="bold" fill="#B45309">mepc 指向触发异常的那条指令</text>

  <rect x="466" y="88" width="404" height="316" rx="8" fill="#F5F3FF" stroke="#7E22CE" stroke-width="1.5"/>
  <rect x="466" y="88" width="404" height="46" rx="8" fill="#EDE9FE"/>
  <text x="482" y="118" font-size="15" font-weight="bold" fill="#581C87">异步中断</text>
  <text x="482" y="158" font-size="12.5" fill="#374151">由外部事件引起，和当前指令无关</text>
  <rect x="482" y="176" width="372" height="104" rx="5" fill="#ffffff" stroke="#C4B5FD"/>
  <text x="496" y="198" font-size="11.5" fill="#1f2937" font-family="monospace">软件中断     一个核通知另一个核</text>
  <text x="496" y="220" font-size="11.5" fill="#1f2937" font-family="monospace">时钟中断     mtime 到达 mtimecmp</text>
  <text x="496" y="242" font-size="11.5" fill="#1f2937" font-family="monospace">外部中断     外设通过中断控制器请求</text>
  <text x="496" y="264" font-size="11.5" fill="#6B7280">本章只接一根外部中断请求线</text>
  <text x="482" y="310" font-size="12" fill="#374151">中断可以在指令之间响应：</text>
  <text x="482" y="334" font-size="12" fill="#374151">当前指令照常做完，</text>
  <text x="482" y="356" font-size="12" fill="#374151">下一条先让给处理程序。</text>
  <text x="482" y="384" font-size="12" font-weight="bold" fill="#B45309">mepc 指向本该接着执行的下一条</text>

  <text x="30" y="438" font-size="12.5" fill="#374151">无论哪种陷入，硬件都做同一件事：记下回哪儿、记下为什么、关中断、把 PC 换成入口地址。</text>
  <text x="30" y="460" font-size="12.5" fill="#B45309">区别只在 mcause 最高位：异常为 0，中断为 1。</text>
</svg>
