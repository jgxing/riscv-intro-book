<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 3-2　程序内存布局与栈帧</title>
  <desc>左侧显示代码段在低地址、栈在高地址并向下增长；右侧放大当前函数的栈帧，标出返回地址、保存寄存器和局部变量相对 sp 的偏移。</desc>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 3-2　程序内存布局与栈帧</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">栈从高地址向下长，每层调用占一段栈帧</text>

  <!-- 左侧整体布局 -->
  <text x="60" y="92" font-size="11.5" fill="#9CA3AF">高地址</text>
  <rect x="50" y="100" width="210" height="80" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="155" y="132" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">栈</text>
  <text x="155" y="156" font-size="11" fill="#3a3a38" text-anchor="middle">向低地址增长</text>

  <rect x="50" y="180" width="210" height="66" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.1"/>
  <text x="155" y="219" font-size="12" fill="#9CA3AF" text-anchor="middle">空闲空间</text>

  <rect x="50" y="246" width="210" height="60" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.1"/>
  <text x="155" y="281" font-size="13" fill="#7a4f00" text-anchor="middle">堆</text>

  <rect x="50" y="306" width="210" height="70" fill="#F3E8F6" stroke="#7B4A8A" stroke-width="1.1"/>
  <text x="155" y="340" font-size="13" fill="#5E2E6E" text-anchor="middle">数据段</text>
  <text x="155" y="359" font-size="10.5" fill="#5F5E5A" text-anchor="middle">.data / .bss</text>

  <rect x="50" y="376" width="210" height="84" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.3"/>
  <text x="155" y="412" font-size="13" font-weight="bold" fill="#7a2020" text-anchor="middle">代码段</text>
  <text x="155" y="432" font-size="10.5" fill="#5F5E5A" text-anchor="middle">.text</text>
  <text x="60" y="480" font-size="11.5" fill="#9CA3AF">低地址</text>

  <line x1="278" y1="112" x2="278" y2="172" stroke="#185FA5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="290" y="145" font-size="11" fill="#0C447C">sp 向下</text>

  <!-- 右侧栈帧放大 -->
  <text x="350" y="92" font-size="13.5" font-weight="bold" fill="#1f2937">当前栈帧放大</text>

  <rect x="350" y="105" width="420" height="60" rx="6" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="560" y="141" font-size="13" fill="#5F5E5A" text-anchor="middle">调用者的栈帧（更早的函数）</text>

  <rect x="350" y="180" width="420" height="50" rx="6" fill="#EDECE8" stroke="#9CA3AF" stroke-width="1.1"/>
  <text x="560" y="211" font-size="12" fill="#5F5E5A" text-anchor="middle">上一层调用留下的栈帧</text>

  <rect x="350" y="245" width="420" height="200" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
  <text x="560" y="272" font-size="13.5" font-weight="bold" fill="#0C447C" text-anchor="middle">当前函数刚分配的 16 字节栈帧</text>

  <rect x="390" y="288" width="340" height="36" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="405" y="312" font-size="12.5" fill="#7a2020">sp + 12　ra（返回地址）</text>

  <rect x="390" y="330" width="340" height="36" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.1"/>
  <text x="405" y="354" font-size="12.5" fill="#7a4f00">sp + 8　s0（被调用方保存）</text>

  <rect x="390" y="372" width="340" height="36" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.1"/>
  <text x="405" y="396" font-size="12.5" fill="#2d5c43">sp + 0　局部变量（8 字节）</text>

  <line x1="370" y1="445" x2="370" y2="408" stroke="#185FA5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="385" y="466" font-size="12.5" font-weight="bold" fill="#0C447C">sp 指向栈顶</text>

  <text x="350" y="510" font-size="12" fill="#3a3a38">函数返回时先恢复寄存器，再把 sp 加回去，栈帧自动作废。</text>
  <text x="350" y="534" font-size="12" fill="#3a3a38">栈帧取 16 字节的倍数，是为了满足调用约定的对齐要求。</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#185FA5"/>
    </marker>
  </defs>
</svg>
