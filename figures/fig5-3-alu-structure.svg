<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 5-3　32 位 ALU 的结构</title>
  <desc>加法器、逻辑运算、比较器和移位器并行计算结果，最后由多路选择器按 alu_op 选出一路作为 result，另有零标志输出。</desc>
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-3　32 位 ALU 的结构</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">几种运算同时算，选择信号只负责挑出要的那一个</text>

  <g text-anchor="middle">
    <rect x="30" y="150" width="85" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="72" y="178" font-size="13" fill="#0C447C">a [31:0]</text>
    <rect x="30" y="290" width="85" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="72" y="318" font-size="13" fill="#0C447C">b [31:0]</text>

    <rect x="165" y="250" width="95" height="48" rx="6" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="212" y="271" font-size="12" font-weight="bold" fill="#7a4f00">取反/直通</text>
    <text x="212" y="289" font-size="11" fill="#3a3a38">SUB 时取反</text>

    <rect x="310" y="115" width="145" height="58" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.7"/>
    <text x="382" y="140" font-size="13" font-weight="bold" fill="#0C447C">32 位加法器</text>
    <text x="382" y="160" font-size="11" fill="#3a3a38">ADD / SUB</text>

    <rect x="310" y="195" width="145" height="58" rx="6" fill="#ffffff" stroke="#3B7A57" stroke-width="1.7"/>
    <text x="382" y="220" font-size="13" font-weight="bold" fill="#2d5c43">逻辑运算</text>
    <text x="382" y="240" font-size="11" fill="#3a3a38">AND / OR / XOR</text>

    <rect x="310" y="275" width="145" height="58" rx="6" fill="#ffffff" stroke="#8B5BA8" stroke-width="1.7"/>
    <text x="382" y="300" font-size="13" font-weight="bold" fill="#5e2f78">比较器</text>
    <text x="382" y="320" font-size="11" fill="#3a3a38">SLT 有符号比较</text>

    <rect x="310" y="355" width="145" height="58" rx="6" fill="#ffffff" stroke="#BA7517" stroke-width="1.7"/>
    <text x="382" y="380" font-size="13" font-weight="bold" fill="#7a4f00">移位器</text>
    <text x="382" y="400" font-size="11" fill="#3a3a38">SLL / SRL</text>

    <rect x="555" y="190" width="85" height="190" rx="6" fill="#EDECE8" stroke="#9CA3AF" stroke-width="1.8"/>
    <text x="597" y="280" font-size="15" font-weight="bold" fill="#3a3a38">MUX</text>
    <text x="597" y="305" font-size="11" fill="#5F5E5A">按 alu_op</text>
    <text x="597" y="322" font-size="11" fill="#5F5E5A">选一路</text>

    <rect x="710" y="235" width="100" height="44" rx="6" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.4"/>
    <text x="760" y="263" font-size="13" fill="#2d5c43">result</text>

    <rect x="710" y="345" width="100" height="44" rx="6" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.4"/>
    <text x="760" y="373" font-size="13" fill="#7a2020">zero</text>

    <rect x="440" y="440" width="90" height="34" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.3"/>
    <text x="485" y="463" font-size="12" fill="#7a4f00">alu_op</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)">
    <line x1="115" y1="172" x2="308" y2="145"/>
    <line x1="115" y1="312" x2="163" y2="278"/>
    <line x1="260" y1="274" x2="308" y2="152"/>
    <line x1="115" y1="172" x2="308" y2="225"/>
    <line x1="115" y1="312" x2="308" y2="230"/>
    <line x1="115" y1="172" x2="308" y2="305"/>
    <line x1="115" y1="312" x2="308" y2="310"/>
    <line x1="115" y1="172" x2="308" y2="385"/>
    <line x1="115" y1="312" x2="308" y2="390"/>
    <line x1="455" y1="144" x2="553" y2="215"/>
    <line x1="455" y1="224" x2="553" y2="250"/>
    <line x1="455" y1="304" x2="553" y2="290"/>
    <line x1="455" y1="384" x2="553" y2="340"/>
    <line x1="640" y1="285" x2="708" y2="257"/>
    <line x1="485" y1="440" x2="597" y2="382"/>
  </g>
  <g stroke="#A32D2D" stroke-width="1.5" marker-end="url(#c)">
    <line x1="640" y1="285" x2="708" y2="365"/>
  </g>
  <text x="655" y="360" font-size="11" fill="#7a2020">判零</text>

  <text x="30" y="462" font-size="11.5" fill="#5F5E5A">SUB 用 a + (~b) + 1 完成；result 为 0 时 zero 置 1，供分支指令使用。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#A32D2D"/>
    </marker>
  </defs>
</svg>
