<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 10-4　load-use 停顿的时空图</title>
  <desc>lw 的数据到 MEM 级末才有效，紧跟的 add 在 EX 级等不到，于是插入一个气泡，整条流水线停一拍。</desc>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>

  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">图 10-4　load-use 停顿的时空图</text>
  <text x="28" y="60" font-size="12.5" fill="#5F5E5A">气泡让 add 晚一拍进 EX，等 lw 的数据从 MEM/WB 转发过来</text>

  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="290" y="100">周期1</text><text x="360" y="100">周期2</text>
    <text x="430" y="100">周期3</text><text x="500" y="100">周期4</text>
    <text x="570" y="100">周期5</text><text x="640" y="100">周期6</text>
    <text x="710" y="100">周期7</text><text x="780" y="100">周期8</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="230" y="148" font-family="monospace">lw x5,0(x10)</text>
    <text x="230" y="218" font-family="monospace">addi x6,x5,1</text>
    <text x="230" y="288" font-family="monospace">addi x7,x0,4</text>
  </g>

  <!-- lw 行 -->
  <g font-size="11" text-anchor="middle">
    <rect x="250" y="118" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="285" y="139" fill="#0B3D6E">IF</text>
    <rect x="320" y="118" width="70" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="355" y="139" fill="#581C87">ID</text>
    <rect x="390" y="118" width="70" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="425" y="139" fill="#7C2D12">EX</text>
    <rect x="460" y="118" width="70" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="495" y="139" fill="#065F46">MEM 读数据</text>
    <rect x="530" y="118" width="70" height="32" rx="3" fill="#FEE2E2" stroke="#B91C1C"/><text x="565" y="139" fill="#991B1B">WB</text>
  </g>
  <!-- addi x6 行，前面有气泡 -->
  <g font-size="11" text-anchor="middle">
    <rect x="320" y="188" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="355" y="209" fill="#0B3D6E">IF</text>
    <rect x="390" y="188" width="70" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="425" y="209" fill="#581C87">ID 读 x5</text>
    <rect x="460" y="188" width="70" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE" stroke-dasharray="4,2"/><text x="495" y="209" fill="#581C87">ID 重读</text>
    <rect x="530" y="188" width="70" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="565" y="209" fill="#7C2D12">EX 转发</text>
    <rect x="600" y="188" width="70" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="635" y="209" fill="#065F46">MEM</text>
    <rect x="670" y="188" width="70" height="32" rx="3" fill="#FEE2E2" stroke="#B91C1C"/><text x="705" y="209" fill="#991B1B">WB</text>
  </g>
  <!-- 气泡 -->
  <rect x="460" y="238" width="70" height="24" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="4,2"/>
  <text x="495" y="255" font-size="10.5" fill="#6B7280" text-anchor="middle">气泡</text>
  <text x="500" y="282" font-size="11" fill="#B45309" text-anchor="middle">周期 4 的 EX 级插入气泡，addi 停在 ID 级多等一拍</text>

  <!-- x7 行 -->
  <g font-size="11" text-anchor="middle">
    <rect x="390" y="298" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="425" y="319" fill="#0B3D6E">IF</text>
    <rect x="460" y="298" width="70" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="495" y="319" fill="#581C87">ID</text>
    <rect x="530" y="298" width="70" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="565" y="319" fill="#7C2D12">EX</text>
    <rect x="600" y="298" width="70" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="635" y="319" fill="#065F46">MEM</text>
    <rect x="670" y="298" width="70" height="32" rx="3" fill="#FEE2E2" stroke="#B91C1C"/><text x="705" y="319" fill="#991B1B">WB</text>
  </g>

  <!-- 停顿信号说明 -->
  <rect x="28" y="348" width="884" height="52" rx="6" fill="#F5F3FF" stroke="#7E22CE"/>
  <text x="44" y="370" font-size="12" fill="#581C87" font-weight="bold">停顿检测：ID/EX 里是 load，且它的 rd 等于 IF/ID 要读的 rs1 或 rs2</text>
  <text x="44" y="390" font-size="11.5" fill="#374151">检测到就三件事一起做：PC 保持不变、IF/ID 保持不变、ID/EX 清零插入气泡</text>

  <text x="28" y="426" font-size="12" fill="#047857">代价是这一拍没有指令前进，CPI 增加 1。比插 NOP 好在由硬件自动判断，程序员不必手工安排空指令。</text>
  <text x="28" y="450" font-size="12" fill="#B45309">停顿只发生在 load 紧跟使用的情况；普通 ALU 结果靠转发就能满足时序，不必停顿。</text>
</svg>
