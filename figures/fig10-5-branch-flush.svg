<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 10-5　分支预测错误时的冲刷</title>
  <desc>分支在 EX 级判出跳转，此时后面两条指令已经取进流水线，必须把它们作废，从目标地址重新取指。</desc>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>

  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">图 10-5　分支预测错误时的冲刷</text>
  <text x="28" y="60" font-size="12.5" fill="#5F5E5A">默认"不跳转"往下取指；判出跳转后，已经取进来的两条指令要作废</text>

  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="300" y="100">周期1</text><text x="370" y="100">周期2</text>
    <text x="440" y="100">周期3</text><text x="510" y="100">周期4</text>
    <text x="580" y="100">周期5</text><text x="650" y="100">周期6</text>
    <text x="720" y="100">周期7</text><text x="790" y="100">周期8</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="240" y="148" font-family="monospace">beq（跳转）</text>
    <text x="240" y="218" font-family="monospace">I+1 错误路径</text>
    <text x="240" y="288" font-family="monospace">I+2 错误路径</text>
    <text x="240" y="358" font-family="monospace">target 目标</text>
  </g>

  <!-- beq 行 -->
  <g font-size="11" text-anchor="middle">
    <rect x="260" y="118" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="295" y="139" fill="#0B3D6E">IF</text>
    <rect x="330" y="118" width="70" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="365" y="139" fill="#581C87">ID</text>
    <rect x="400" y="118" width="70" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="435" y="139" fill="#7C2D12">EX 判跳转</text>
    <rect x="470" y="118" width="70" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="505" y="139" fill="#065F46">MEM</text>
    <rect x="540" y="118" width="70" height="32" rx="3" fill="#FEE2E2" stroke="#B91C1C"/><text x="575" y="139" fill="#991B1B">WB</text>
  </g>
  <!-- I+1 行，ID 级被冲刷 -->
  <g font-size="11" text-anchor="middle">
    <rect x="330" y="188" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="365" y="209" fill="#0B3D6E">IF</text>
    <rect x="400" y="188" width="70" height="32" rx="3" fill="#F3F4F6" stroke="#B91C1C" stroke-dasharray="4,2"/><text x="435" y="209" fill="#991B1B">ID 冲刷</text>
  </g>
  <!-- I+2 行，IF 级被冲刷 -->
  <g font-size="11" text-anchor="middle">
    <rect x="400" y="258" width="70" height="32" rx="3" fill="#F3F4F6" stroke="#B91C1C" stroke-dasharray="4,2"/><text x="435" y="279" fill="#991B1B">IF 冲刷</text>
  </g>
  <!-- target 行 -->
  <g font-size="11" text-anchor="middle">
    <rect x="470" y="328" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="505" y="349" fill="#0B3D6E">IF 重取</text>
    <rect x="540" y="328" width="70" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="575" y="349" fill="#581C87">ID</text>
    <rect x="610" y="328" width="70" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="645" y="349" fill="#7C2D12">EX</text>
    <rect x="680" y="328" width="70" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="715" y="349" fill="#065F46">MEM</text>
  </g>

  <path d="M435 158 L435 180" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#red)"/>
  <path d="M435 228 L435 256" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#red)"/>
  <defs>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect x="28" y="384" width="884" height="50" rx="6" fill="#FEF2F2" stroke="#B91C1C"/>
  <text x="44" y="406" font-size="12" fill="#991B1B" font-weight="bold">冲刷动作：redirect 为真时，把 IF/ID 和 ID/EX 两级清零，PC 换成跳转目标</text>
  <text x="44" y="425" font-size="11.5" fill="#374151">清零让错误指令变成空操作，即使已经进了流水线也不会写寄存器或改内存</text>

  <text x="28" y="458" font-size="12" fill="#B45309">代价：正确目标处的指令要晚两拍才开始执行，这两拍就是分支预测错误的开销。</text>
</svg>
