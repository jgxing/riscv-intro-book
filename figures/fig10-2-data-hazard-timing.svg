<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 10-2　数据相关的时序问题</title>
  <desc>addi 在周期 5 的 WB 级才写回 x1，而 add 在周期 4 的 ID 级就要读 x1，读到的是旧值。</desc>
  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>

  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">图 10-2　数据相关的时序问题</text>
  <text x="28" y="60" font-size="12.5" fill="#5F5E5A">addi 把 5 写进 x1，紧跟的 add 要用 x1；中间没有间隔会读到旧值</text>

  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="320" y="100">周期1</text><text x="400" y="100">周期2</text>
    <text x="480" y="100">周期3</text><text x="560" y="100">周期4</text>
    <text x="640" y="100">周期5</text><text x="720" y="100">周期6</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="250" y="148" font-family="monospace">addi x1,x0,5</text>
    <text x="250" y="208" font-family="monospace">add  x2,x1,x3</text>
  </g>

  <!-- addi 行 -->
  <g font-size="11" text-anchor="middle">
    <rect x="280" y="118" width="80" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="320" y="139" fill="#0B3D6E">IF</text>
    <rect x="360" y="118" width="80" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="400" y="139" fill="#581C87">ID</text>
    <rect x="440" y="118" width="80" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="480" y="139" fill="#7C2D12">EX</text>
    <rect x="520" y="118" width="80" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="560" y="139" fill="#065F46">MEM</text>
    <rect x="600" y="118" width="80" height="32" rx="3" fill="#FEE2E2" stroke="#B91C1C"/><text x="640" y="139" fill="#991B1B">WB 写 x1=5</text>
  </g>
  <!-- add 行 -->
  <g font-size="11" text-anchor="middle">
    <rect x="360" y="178" width="80" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="400" y="199" fill="#0B3D6E">IF</text>
    <rect x="440" y="178" width="80" height="32" rx="3" fill="#F3E8FF" stroke="#7E22CE"/><text x="480" y="199" fill="#581C87">ID 读 x1</text>
    <rect x="520" y="178" width="80" height="32" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="560" y="199" fill="#7C2D12">EX</text>
    <rect x="600" y="178" width="80" height="32" rx="3" fill="#D1FAE5" stroke="#047857"/><text x="640" y="199" fill="#065F46">MEM</text>
    <rect x="680" y="178" width="80" height="32" rx="3" fill="#FEE2E2" stroke="#B91C1C"/><text x="720" y="199" fill="#991B1B">WB</text>
  </g>

  <!-- 问题标注 -->
  <path d="M480 210 L480 240 L600 240 L600 152" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="5,3"/>
  <circle cx="480" cy="196" r="4" fill="#B91C1C"/>
  <circle cx="640" cy="138" r="4" fill="#B91C1C"/>
  <rect x="372" y="252" width="470" height="46" rx="6" fill="#FEF2F2" stroke="#B91C1C"/>
  <text x="386" y="272" font-size="12" fill="#991B1B">add 在周期 4 读 x1，此时 addi 还没到 WB，读到的是旧值 0</text>
  <text x="386" y="290" font-size="12" fill="#991B1B">结果 add 算出错误的 x2，这就是数据冒险</text>

  <!-- 三种距离 -->
  <text x="28" y="334" font-size="13.5" font-weight="bold" fill="#374151">消费者和生产者相隔几条指令，情况不同</text>
  <rect x="28" y="348" width="280" height="52" rx="5" fill="#F5F3FF" stroke="#7E22CE"/>
  <text x="42" y="370" font-size="11.5" fill="#581C87" font-weight="bold">隔 1 条</text>
  <text x="42" y="390" font-size="11" fill="#374151">结果已在 EX 级算出，转发可得</text>
  <rect x="320" y="348" width="280" height="52" rx="5" fill="#F5F3FF" stroke="#7E22CE"/>
  <text x="334" y="370" font-size="11.5" fill="#581C87" font-weight="bold">隔 2 条</text>
  <text x="334" y="390" font-size="11" fill="#374151">结果在 MEM/WB，转发可得</text>
  <rect x="612" y="348" width="280" height="52" rx="5" fill="#FEF2F2" stroke="#B91C1C"/>
  <text x="626" y="370" font-size="11.5" fill="#991B1B" font-weight="bold">lw 的结果</text>
  <text x="626" y="390" font-size="11" fill="#374151">MEM 末才拿到，必须停一拍</text>

  <text x="28" y="428" font-size="12" fill="#047857">普通 ALU 指令的结果在 EX 级末尾就有了，能赶上下一条；load 要等访存，来不及。</text>
  <text x="28" y="452" font-size="12" fill="#B45309">另一种更隐蔽的情况隔着 3 条指令，靠寄存器堆"同拍写、同拍读"的旁路解决。</text>
</svg>
