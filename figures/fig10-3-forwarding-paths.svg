<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 10-3　两条转发路径</title>
  <desc>EX/MEM 和 MEM/WB 两级各有一条线回到 EX 级的 ALU 输入选择器，选择器按目的寄存器号命中情况选值。</desc>
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>

  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">图 10-3　两条转发路径</text>
  <text x="28" y="60" font-size="12.5" fill="#5F5E5A">把还没写进寄存器堆的结果，直接从后级拉回 ALU 入口</text>

  <!-- 五级方框 -->
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="130" width="130" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="125" y="154" fill="#0B3D6E" font-weight="bold">IF</text><text x="125" y="172" fill="#0B3D6E" font-size="10">取指</text>
    <rect x="230" y="130" width="130" height="56" rx="6" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.5"/><text x="295" y="154" fill="#581C87" font-weight="bold">ID</text><text x="295" y="172" fill="#581C87" font-size="10">读寄存器</text>
    <rect x="400" y="130" width="130" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="465" y="154" fill="#7C2D12" font-weight="bold">EX</text><text x="465" y="172" fill="#7C2D12" font-size="10">ALU</text>
    <rect x="570" y="130" width="130" height="56" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><text x="635" y="154" fill="#065F46" font-weight="bold">MEM</text><text x="635" y="172" fill="#065F46" font-size="10">访存</text>
    <rect x="740" y="130" width="130" height="56" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="805" y="154" fill="#991B1B" font-weight="bold">WB</text><text x="805" y="172" fill="#991B1B" font-size="10">写回</text>
  </g>
  <!-- 主数据流箭头 -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M190 158 L226 158"/><path d="M360 158 L396 158"/>
    <path d="M530 158 L566 158"/><path d="M700 158 L736 158"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#047857"/>
    </marker>
    <marker id="arrowP" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7E22CE"/>
    </marker>
  </defs>

  <!-- 级间寄存器标签 -->
  <g font-size="10.5" fill="#6B7280" text-anchor="middle">
    <text x="210" y="196">IF/ID</text><text x="380" y="196">ID/EX</text>
    <text x="550" y="196">EX/MEM</text><text x="720" y="196">MEM/WB</text>
  </g>

  <!-- 转发路径 1：EX/MEM → EX -->
  <path d="M635 186 L635 300 L486 300 L486 188" fill="none" stroke="#047857" stroke-width="2.6" marker-end="url(#arrowG)"/>
  <rect x="508" y="278" width="220" height="30" rx="5" fill="#ECFDF5" stroke="#047857"/>
  <text x="618" y="298" font-size="11.5" fill="#065F46" text-anchor="middle">路径一：EX/MEM 的 alu 结果</text>

  <!-- 转发路径 2：MEM/WB → EX -->
  <path d="M805 186 L805 372 L444 372 L444 188" fill="none" stroke="#7E22CE" stroke-width="2.6" marker-end="url(#arrowP)"/>
  <rect x="500" y="350" width="250" height="30" rx="5" fill="#F5F3FF" stroke="#7E22CE"/>
  <text x="625" y="370" font-size="11.5" fill="#581C87" text-anchor="middle">路径二：MEM/WB 的写回数据</text>

  <!-- EX 级的选择器 -->
  <rect x="396" y="226" width="138" height="42" rx="5" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="465" y="244" font-size="11" fill="#7C2D12" text-anchor="middle">ALU 输入选择器</text>
  <text x="465" y="260" font-size="10" fill="#7C2D12" text-anchor="middle">寄存器值 / 两条转发</text>

  <!-- 命中判据 -->
  <rect x="60" y="240" width="300" height="150" rx="6" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="76" y="264" font-size="12.5" font-weight="bold" fill="#374151">怎么决定走哪条路径</text>
  <text x="76" y="290" font-size="11.5" fill="#047857">EX/MEM 命中：该级要写寄存器，</text>
  <text x="76" y="308" font-size="11.5" fill="#047857">且 rd 等于当前 EX 的源寄存器</text>
  <text x="76" y="334" font-size="11.5" fill="#7E22CE">MEM/WB 命中：同理，但优先级低</text>
  <text x="76" y="358" font-size="11.5" fill="#991B1B">两级同时命中时选 EX/MEM，</text>
  <text x="76" y="376" font-size="11.5" fill="#991B1B">因为它的结果更新</text>

  <text x="28" y="440" font-size="12" fill="#374151">转发的实质是加两组比较器和数据选择器：比较"后级要写的寄存器"和"当前要读的寄存器"，相等就把后级结果接过来。</text>
  <text x="28" y="464" font-size="12" fill="#B45309">注意 EX/MEM 阶段若是 load，里面装的是访存地址而非数据，这条路径必须排除 load，否则转发的是错值。</text>
  <text x="28" y="490" font-size="12" fill="#6B7280">隔三条指令的依赖发生在寄存器堆读写的同一拍，靠寄存器堆内部的写直通解决，不需要额外的转发线。</text>
</svg>
