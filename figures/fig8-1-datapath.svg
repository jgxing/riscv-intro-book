<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 8-1　RV32I 单周期处理器数据通路</title>
  <desc>一条指令在一个时钟周期内依次经过取指、译码、执行、访存、写回五个环节，写回结果在时钟沿存入寄存器堆，下一条指令地址由选择逻辑给出。</desc>
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 8-1　RV32I 单周期处理器数据通路</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">蓝色实线是数据，橙色虚线是控制信号，绿色实线是写回</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#185FA5"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3B7A57"/>
    </marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#BA7517"/>
    </marker>
  </defs>

  <g text-anchor="middle">
    <rect x="30" y="105" width="130" height="52" rx="6" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.5"/>
    <text x="95" y="128" font-size="12.5" font-weight="bold" fill="#7a4f00">下条 PC 选择</text>
    <text x="95" y="146" font-size="10.5" fill="#3a3a38">pc_src</text>

    <rect x="230" y="105" width="110" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
    <text x="285" y="128" font-size="13" font-weight="bold" fill="#0C447C">PC</text>
    <text x="285" y="146" font-size="10.5" fill="#3a3a38">复位 0x00400000</text>

    <rect x="420" y="105" width="150" height="52" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="495" y="128" font-size="13" font-weight="bold" fill="#0C447C">指令存储器</text>
    <text x="495" y="146" font-size="10.5" fill="#3a3a38">code ROM</text>

    <rect x="420" y="215" width="210" height="76" rx="6" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.7"/>
    <text x="525" y="240" font-size="13" font-weight="bold" fill="#7a4f00">控制单元</text>
    <text x="525" y="260" font-size="11" fill="#3a3a38">指令译码 · 立即数生成</text>
    <text x="525" y="278" font-size="11" fill="#3a3a38">分支判断 · 控制信号</text>

    <rect x="70" y="380" width="150" height="86" rx="6" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.7"/>
    <text x="145" y="405" font-size="13" font-weight="bold" fill="#2d5c43">寄存器堆</text>
    <text x="145" y="425" font-size="11" fill="#3a3a38">32 × 32 位</text>
    <text x="145" y="445" font-size="10.5" fill="#3a3a38">rs1 rs2 rd</text>

    <rect x="310" y="385" width="130" height="76" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.7"/>
    <text x="375" y="412" font-size="13" font-weight="bold" fill="#0C447C">ALU</text>
    <text x="375" y="432" font-size="10.5" fill="#3a3a38">运算 / 地址</text>
    <text x="375" y="450" font-size="10.5" fill="#3a3a38">alu_op</text>

    <rect x="540" y="380" width="150" height="86" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.7"/>
    <text x="615" y="405" font-size="13" font-weight="bold" fill="#0C447C">数据存储器</text>
    <text x="615" y="425" font-size="11" fill="#3a3a38">data RAM</text>
    <text x="615" y="445" font-size="10.5" fill="#3a3a38">字节使能 / 扩展</text>

    <rect x="555" y="530" width="150" height="56" rx="6" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.6"/>
    <text x="630" y="553" font-size="12.5" font-weight="bold" fill="#7a4f00">写回数据选择</text>
    <text x="630" y="572" font-size="10.5" fill="#3a3a38">wreg_src</text>

    <rect x="790" y="385" width="140" height="76" rx="6" fill="#EDECE8" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="860" y="410" font-size="11.5" font-weight="bold" fill="#3a3a38">地址加法器</text>
    <text x="860" y="430" font-size="10.5" fill="#3a3a38">pc + 4</text>
    <text x="860" y="448" font-size="10.5" fill="#3a3a38">pc + imm</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M160 131 L230 131"/>
    <path d="M340 131 L420 131"/>
    <path d="M495 157 L495 215"/>
    <path d="M420 131 L360 131 L360 380"/>
    <path d="M220 410 L310 410"/>
    <path d="M220 440 L290 440 L290 425 L310 425"/>
    <path d="M440 423 L540 423"/>
    <path d="M690 440 L790 440"/>
  </g>

  <g stroke="#3B7A57" stroke-width="1.7" fill="none" marker-end="url(#g)">
    <path d="M615 466 L615 530"/>
    <path d="M555 558 L145 558 L145 466"/>
  </g>

  <g stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#a)" opacity="0.85">
    <path d="M440 445 L530 445 L530 558 L555 558"/>
    <path d="M495 90 L495 80 L285 80 L285 105"/>
    <path d="M930 423 L955 423 L955 131 L800 131 L790 131"/>
  </g>

  <g stroke="#BA7517" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#o)">
    <path d="M630 215 L630 160 L95 160 L95 157"/>
    <path d="M420 250 L260 250 L260 380"/>
    <path d="M470 291 L470 385"/>
    <path d="M505 291 L505 380"/>
    <path d="M600 291 L600 380"/>
    <path d="M560 291 L560 530"/>
  </g>

  <g font-size="10.5" fill="#7a4f00">
    <text x="330" y="245">we</text>
    <text x="476" y="340">alu_src_b</text>
    <text x="512" y="340" transform="rotate(90 512 340)">alu_op</text>
    <text x="608" y="340">mem_write</text>
    <text x="566" y="512">wreg_src</text>
    <text x="100" y="180">pc_src</text>
  </g>

  <g font-size="10.5" fill="#185FA5">
    <text x="250" y="126">pc</text>
    <text x="360" y="126">instr</text>
    <text x="185" y="404">r1</text>
    <text x="185" y="438">r2</text>
    <text x="475" y="418">b</text>
    <text x="615" y="476">rdata</text>
    <text x="855" y="476">addr</text>
  </g>
  <g font-size="10.5" fill="#3B7A57">
    <text x="360" y="552">wdata</text>
  </g>
</svg>
