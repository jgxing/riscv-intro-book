<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 5-2　全加器与串行进位加法器</title>
  <desc>上半部分用两个半加器拼成一个全加器，下半部分把四个全加器串成四位加法器，进位像流水一样从低位传到高位。</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-2　全加器与串行进位加法器</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">先补上低位送来的进位，再把多位串起来</text>

  <rect x="30" y="85" width="840" height="165" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="50" y="112" font-size="14" font-weight="bold" fill="#0C447C">两个半加器拼成全加器</text>

  <g text-anchor="middle">
    <rect x="60" y="155" width="52" height="34" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="86" y="178" font-size="12" fill="#0C447C">a</text>
    <rect x="60" y="200" width="52" height="34" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="86" y="223" font-size="12" fill="#0C447C">b</text>
    <rect x="60" y="245" width="52" height="34" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="86" y="268" font-size="12" fill="#0C447C">cin</text>

    <rect x="185" y="155" width="92" height="56" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="231" y="180" font-size="13" font-weight="bold" fill="#0C447C">半加器 1</text>
    <text x="231" y="199" font-size="11" fill="#3a3a38">a, b</text>

    <rect x="185" y="235" width="92" height="56" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="231" y="260" font-size="13" font-weight="bold" fill="#0C447C">半加器 2</text>
    <text x="231" y="279" font-size="11" fill="#3a3a38">s1, cin</text>

    <rect x="360" y="180" width="70" height="38" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="395" y="205" font-size="13" fill="#7a4f00">c1 | c2</text>

    <rect x="510" y="155" width="65" height="34" rx="5" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.2"/>
    <text x="542" y="178" font-size="12" fill="#2d5c43">sum</text>
    <rect x="510" y="215" width="65" height="34" rx="5" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.2"/>
    <text x="542" y="238" font-size="12" fill="#2d5c43">cout</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)">
    <line x1="112" y1="172" x2="183" y2="180"/>
    <line x1="112" y1="217" x2="183" y2="195"/>
    <line x1="112" y1="262" x2="183" y2="268"/>
    <line x1="277" y1="175" x2="310" y2="175"/>
    <line x1="310" y1="175" x2="310" y2="253"/>
    <line x1="310" y1="253" x2="183" y2="261"/>
    <line x1="277" y1="198" x2="358" y2="192"/>
    <line x1="277" y1="278" x2="358" y2="205"/>
    <line x1="430" y1="199" x2="508" y2="232"/>
    <line x1="277" y1="264" x2="420" y2="264"/>
    <line x1="420" y1="264" x2="420" y2="180"/>
    <line x1="420" y1="180" x2="508" y2="172"/>
  </g>
  <text x="640" y="180" font-size="12" fill="#3a3a38">sum = a ^ b ^ cin</text>
  <text x="640" y="212" font-size="12" fill="#3a3a38">cout = (a&amp;b) | (cin&amp;(a^b))</text>
  <text x="640" y="245" font-size="11.5" fill="#5F5E5A">两个半加器共用第一个和，</text>
  <text x="640" y="266" font-size="11.5" fill="#5F5E5A">第二个半加器再吃进 cin。</text>

  <rect x="30" y="270" width="840" height="180" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="50" y="297" font-size="14" font-weight="bold" fill="#0C447C">四位串行进位加法器</text>

  <g text-anchor="middle">
    <rect x="80" y="335" width="110" height="62" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="135" y="362" font-size="13" font-weight="bold" fill="#0C447C">全加器 0</text>
    <text x="135" y="383" font-size="11" fill="#3a3a38">a0 b0 cin</text>

    <rect x="260" y="335" width="110" height="62" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="315" y="362" font-size="13" font-weight="bold" fill="#0C447C">全加器 1</text>
    <text x="315" y="383" font-size="11" fill="#3a3a38">a1 b1 c0</text>

    <rect x="440" y="335" width="110" height="62" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="495" y="362" font-size="13" font-weight="bold" fill="#0C447C">全加器 2</text>
    <text x="495" y="383" font-size="11" fill="#3a3a38">a2 b2 c1</text>

    <rect x="620" y="335" width="110" height="62" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="675" y="362" font-size="13" font-weight="bold" fill="#0C447C">全加器 3</text>
    <text x="675" y="383" font-size="11" fill="#3a3a38">a3 b3 c2</text>

    <rect x="770" y="345" width="75" height="40" rx="5" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.4"/>
    <text x="808" y="370" font-size="12" fill="#7a2020">cout</text>
  </g>
  <g stroke="#A32D2D" stroke-width="1.8" marker-end="url(#c)">
    <line x1="190" y1="366" x2="258" y2="366"/>
    <line x1="370" y1="366" x2="438" y2="366"/>
    <line x1="550" y1="366" x2="618" y2="366"/>
    <line x1="730" y1="366" x2="768" y2="366"/>
  </g>
  <g font-size="11" fill="#7a2020" text-anchor="middle">
    <text x="224" y="356">c0</text>
    <text x="404" y="356">c1</text>
    <text x="584" y="356">c2</text>
    <text x="749" y="356">c3</text>
  </g>
  <text x="50" y="430" font-size="12" fill="#3a3a38">进位从低位传到高位，第 31 位的和要等前面 31 级进位都算完才稳定。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#A32D2D"/>
    </marker>
  </defs>
</svg>
