<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 8-4　单周期处理的时序与关键路径</title>
  <desc>每条指令占用一个完整时钟周期，最慢的那条指令经过的取指、译码、寄存器、运算、访存、写回路径决定了时钟周期的下限。</desc>
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 8-4　单周期处理的时序与关键路径</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">所有指令共用同一个节拍，节拍长度由最慢的那条决定</text>

  <g font-size="11.5" fill="#3a3a38" text-anchor="middle">
    <text x="180" y="105">时钟</text>
    <line x1="60" y1="120" x2="850" y2="120" stroke="#9CA3AF" stroke-width="1.2"/>
    <path d="M60 120 L110 120 L110 85 L180 85 L180 120 L230 120 L230 85 L300 85 L300 120 L350 120 L350 85 L420 85 L420 120 L470 120 L470 85 L540 85 L540 120 L590 120 L590 85 L660 85 L660 120 L710 120 L710 85 L780 85 L780 120 L850 120"
          fill="none" stroke="#185FA5" stroke-width="1.6"/>

    <text x="145" y="155">指令 1</text>
    <text x="265" y="155">指令 2</text>
    <text x="385" y="155">指令 3</text>
    <text x="505" y="155">指令 4</text>
    <text x="625" y="155">指令 5</text>
    <text x="745" y="155">指令 6</text>

    <rect x="75" y="170" width="130" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="140" y="190">addi x1, x0, 5</text>
    <rect x="205" y="170" width="130" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="270" y="190">add x3, x1, x2</text>
    <rect x="335" y="170" width="130" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="400" y="190">sw x3, 0(x4)</text>
    <rect x="465" y="170" width="130" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="530" y="190">lw x5, 0(x4)</text>
    <rect x="595" y="170" width="130" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="660" y="190">beq x5, x3, +8</text>
    <rect x="725" y="170" width="130" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="790" y="190">jal x0, 0</text>
  </g>

  <g font-size="12" fill="#1f2937" text-anchor="start">
    <text x="30" y="248" font-weight="bold">一条指令内部，信号要依次经过这些环节</text>
  </g>
  <g text-anchor="middle">
    <rect x="30" y="270" width="130" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="95" y="293" font-size="11.5" fill="#0C447C">取指</text>
    <text x="95" y="310" font-size="10" fill="#3a3a38">PC → ROM</text>
    <rect x="190" y="270" width="130" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="255" y="293" font-size="11.5" fill="#0C447C">译码</text>
    <text x="255" y="310" font-size="10" fill="#3a3a38">control</text>
    <rect x="350" y="270" width="130" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="415" y="293" font-size="11.5" fill="#0C447C">读寄存器</text>
    <text x="415" y="310" font-size="10" fill="#3a3a38">regfile</text>
    <rect x="510" y="270" width="130" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="575" y="293" font-size="11.5" fill="#0C447C">运算</text>
    <text x="575" y="310" font-size="10" fill="#3a3a38">ALU</text>
    <rect x="670" y="270" width="130" height="52" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="735" y="293" font-size="11.5" fill="#0C447C">访存 + 写回</text>
    <text x="735" y="310" font-size="10" fill="#3a3a38">RAM → MUX</text>
  </g>
  <g stroke="#185FA5" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M160 296 L190 296"/>
    <path d="M320 296 L350 296"/>
    <path d="M480 296 L510 296"/>
    <path d="M640 296 L670 296"/>
  </g>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#185FA5"/>
    </marker>
  </defs>

  <g font-size="11.5" fill="#5F5E5A">
    <rect x="30" y="355" width="835" height="96" rx="6" fill="#FAFAF8" stroke="#DDD9D0" stroke-width="1.2"/>
    <text x="45" y="379">load 指令要走完整条路径，是典型的关键路径：取指 → 译码 → 读寄存器 → ALU 算地址 → 读 RAM → 写回 MUX → 时钟沿写入</text>
    <text x="45" y="402">add 指令不需要读 RAM，实际路径短一些，但时钟仍按最长的那条来定</text>
    <text x="45" y="425">在时钟周期内，前面的组合逻辑必须全部稳定，写回才能赶在下一个时钟沿被寄存器采到</text>
    <text x="45" y="445">这就是单周期处理器的效率代价：每条指令都配给最长的时间，短指令也跟着等</text>
  </g>
</svg>
