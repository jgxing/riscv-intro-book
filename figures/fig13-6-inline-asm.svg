<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 13-6　C 与汇编的混合编程</title>
  <desc>C 里访问 CSR 和发起 ecall 没有对应语法，用内联汇编弥补；独立汇编文件则用于启动代码。</desc>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 13-6　C 与汇编的混合编程</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">有些指令 C 表达不了，就掺一点汇编进去</text>

  <!-- 内联汇编 -->
  <rect x="40" y="95" width="410" height="265" rx="10" fill="#EFF6FF" stroke="#185FA5" stroke-width="2"/>
  <text x="245" y="125" font-size="14" font-weight="bold" fill="#0B3D6E" text-anchor="middle">内联汇编 inline asm</text>

  <rect x="60" y="145" width="370" height="95" rx="6" fill="#ffffff" stroke="#93C5FD"/>
  <text x="74" y="168" font-size="11" font-family="monospace" fill="#1f2937">asm volatile (</text>
  <text x="88" y="187" font-size="11" font-family="monospace" fill="#1f2937">"csrr %0, %1"</text>
  <text x="88" y="206" font-size="11" font-family="monospace" fill="#1f2937">: "=r"(value)</text>
  <text x="88" y="225" font-size="11" font-family="monospace" fill="#1f2937">: "i"(csr));</text>

  <text x="60" y="270" font-size="11.5" fill="#0B3D6E">%0、%1 是占位符，对应后面列出的操作数</text>
  <text x="60" y="291" font-size="11.5" fill="#0B3D6E">"=r" 要一个寄存器存结果，"i" 要一个立即数</text>
  <text x="60" y="312" font-size="11.5" fill="#0B3D6E">volatile 阻止编译器把这串汇编优化掉</text>
  <text x="60" y="338" font-size="11.5" font-weight="bold" fill="#185FA5">适合：csrr / csrw / ecall / mret 这类指令</text>

  <!-- 独立汇编 -->
  <rect x="480" y="95" width="380" height="265" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="670" y="125" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">独立汇编文件 start.S</text>

  <rect x="500" y="145" width="340" height="95" rx="6" fill="#ffffff" stroke="#FCD34D"/>
  <text x="514" y="168" font-size="11" font-family="monospace" fill="#1f2937">.section .text.start</text>
  <text x="514" y="187" font-size="11" font-family="monospace" fill="#1f2937">.globl _start</text>
  <text x="514" y="206" font-size="11" font-family="monospace" fill="#1f2937">_start:</text>
  <text x="528" y="225" font-size="11" font-family="monospace" fill="#1f2937">la sp, __stack_top</text>

  <text x="500" y="270" font-size="11.5" fill="#92400E">启动时要设栈、清 bss，动作固定且靠前</text>
  <text x="500" y="291" font-size="11.5" fill="#92400E">用汇编写更直观，也便于精确控制</text>
  <text x="500" y="312" font-size="11.5" fill="#92400E">编译器看不到这些需求，交给他反而麻烦</text>
  <text x="500" y="338" font-size="11.5" font-weight="bold" fill="#D97706">适合：入口代码、中断向量、上下文切换</text>

  <!-- 底部 -->
  <rect x="40" y="380" width="820" height="42" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="56" y="407" font-size="12" fill="#374151">两种办法都会汇进同一个 ELF：内联汇编嵌在函数里，独立汇编单列一个 .text.start 段并放在最前。</text>
</svg>
