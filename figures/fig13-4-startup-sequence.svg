<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 13-4　启动代码的执行顺序</title>
  <desc>复位后从 _start 开始，依次清 bss、设栈指针、调用 main，main 返回后停在死循环。</desc>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 13-4　启动代码的执行顺序</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">C 程序开始前，总有一小段汇编先把运行环境准备好</text>

  <!-- 流程节点 -->
  <rect x="40" y="110" width="160" height="80" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="120" y="142" font-size="13" font-weight="bold" fill="#991B1B" text-anchor="middle">复位 / 上电</text>
  <text x="120" y="164" font-size="10.5" fill="#B91C1C" text-anchor="middle">pc = _start</text>

  <rect x="235" y="110" width="160" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="315" y="142" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">清 .bss</text>
  <text x="315" y="164" font-size="10.5" fill="#92400E" text-anchor="middle">逐字写零</text>

  <rect x="430" y="110" width="160" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="510" y="142" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">设栈指针</text>
  <text x="510" y="164" font-size="10.5" fill="#92400E" text-anchor="middle">sp = __stack_top</text>

  <rect x="625" y="110" width="160" height="80" rx="8" fill="#DBEAFE" stroke="#185FA5" stroke-width="1.5"/>
  <text x="705" y="142" font-size="13" font-weight="bold" fill="#0B3D6E" text-anchor="middle">call main</text>
  <text x="705" y="164" font-size="10.5" fill="#185FA5" text-anchor="middle">进入 C 世界</text>

  <path d="M200 150 L233 150" stroke="#6B7280" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M395 150 L428 150" stroke="#6B7280" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M590 150 L623 150" stroke="#6B7280" stroke-width="2" marker-end="url(#a2)"/>

  <!-- main 内部 -->
  <rect x="235" y="240" width="430" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="450" y="268" font-size="13" font-weight="bold" fill="#0B3D6E" text-anchor="middle">main() 执行你的逻辑</text>
  <text x="450" y="292" font-size="11.5" fill="#1f2937" text-anchor="middle">算求和 → 写 LED → 串口输出 Hi → 进入 while(1)</text>
  <text x="450" y="313" font-size="11" fill="#185FA5" text-anchor="middle">函数调用用栈保存返回地址和局部变量</text>

  <path d="M705 190 L705 225 L450 225 L450 238" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <!-- 停机 -->
  <rect x="40" y="240" width="160" height="90" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="120" y="272" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="middle">main 返回后</text>
  <text x="120" y="294" font-size="11" fill="#6B7280" text-anchor="middle">j 3b</text>
  <text x="120" y="313" font-size="10.5" fill="#6B7280" text-anchor="middle">原地停机</text>

  <path d="M235 285 L202 285" stroke="#6B7280" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="40" y="355" width="820" height="55" rx="6" fill="#FAFAF9" stroke="#D6D3D1"/>
  <text x="56" y="378" font-size="12" fill="#374151">裸机程序的 main 通常不返回。真要返回，也得有个地方接住它——启动代码里的死循环就是那个地方。</text>
  <text x="56" y="399" font-size="11.5" fill="#6B7280">没有操作系统替你收尾，这些事都得自己写清楚。</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280"/>
    </marker>
  </defs>
</svg>
