<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 4-2　组合逻辑与时序逻辑</title>
  <desc>左半部分是组合逻辑，输出只由当前输入决定；右半部分是时序逻辑，寄存器保存状态，输出还与过去的输入有关。</desc>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 4-2　组合逻辑与时序逻辑</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">有没有寄存器，是两类电路最直观的区别</text>

  <rect x="30" y="90" width="400" height="290" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="50" y="118" font-size="15" font-weight="bold" fill="#0C447C">组合逻辑</text>
  <text x="50" y="142" font-size="12" fill="#3a3a38">没有记忆，输出只由当前输入决定</text>

  <g text-anchor="middle">
    <rect x="65" y="190" width="70" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="100" y="220" font-size="13" fill="#0C447C">a</text>
    <rect x="65" y="260" width="70" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="100" y="290" font-size="13" fill="#0C447C">b</text>
    <rect x="200" y="220" width="110" height="60" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="255" y="256" font-size="13" font-weight="bold" fill="#0C447C">门电路网络</text>
    <rect x="350" y="230" width="60" height="40" rx="6" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.3"/>
    <text x="380" y="255" font-size="13" fill="#2d5c43">y</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="135" y1="215" x2="198" y2="235"/>
    <line x1="135" y1="285" x2="198" y2="265"/>
    <line x1="310" y1="250" x2="348" y2="250"/>
  </g>
  <text x="50" y="345" font-size="12" fill="#3a3a38">输入一变，经过门延迟后输出就变。</text>
  <text x="50" y="366" font-size="12" fill="#3a3a38">加法器、译码器、多路选择器都是这一类。</text>

  <rect x="450" y="90" width="420" height="290" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="470" y="118" font-size="15" font-weight="bold" fill="#7a4f00">时序逻辑</text>
  <text x="470" y="142" font-size="12" fill="#3a3a38">有记忆，输出还与过去的输入有关</text>

  <g text-anchor="middle">
    <rect x="485" y="230" width="60" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="515" y="255" font-size="13" fill="#0C447C">输入</text>
    <rect x="590" y="220" width="95" height="60" rx="6" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
    <text x="637" y="256" font-size="13" fill="#0C447C">组合逻辑</text>
    <rect x="720" y="220" width="85" height="60" rx="6" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.8"/>
    <text x="762" y="250" font-size="13" font-weight="bold" fill="#7a4f00">寄存器</text>
    <text x="762" y="268" font-size="11" fill="#7a4f00">clk 上升沿</text>
    <rect x="842" y="230" width="10" height="40" fill="none"/>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="545" y1="250" x2="588" y2="250"/>
    <line x1="685" y1="250" x2="718" y2="250"/>
    <line x1="805" y1="250" x2="860" y2="250"/>
  </g>
  <path d="M762,220 C762,170 637,170 637,218" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="166" font-size="11.5" fill="#7a4f00" text-anchor="middle">状态反馈</text>
  <text x="470" y="345" font-size="12" fill="#3a3a38">寄存器只在时钟沿改变，其余时间保持。</text>
  <text x="470" y="366" font-size="12" fill="#3a3a38">状态机、计数器、流水线寄存器都是这一类。</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
