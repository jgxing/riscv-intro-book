<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 5-4　寄存器堆的结构</title>
  <desc>32 个 32 位寄存器排成阵列，两个读地址各驱动一个 32 选 1 多路选择器，写地址经译码器产生独热的写使能信号。</desc>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-4　寄存器堆的结构</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">两个读端口可以同时看两个寄存器，一个写端口每拍最多写一个</text>

  <rect x="285" y="105" width="300" height="270" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.3"/>
  <text x="435" y="132" font-size="14" font-weight="bold" fill="#3a3a38" text-anchor="middle">32 个 32 位寄存器</text>

  <g font-size="11.5" fill="#3a3a38" text-anchor="middle">
    <rect x="315" y="155" width="240" height="36" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
    <text x="435" y="179">x0　　固定为 0</text>
    <rect x="315" y="200" width="240" height="36" rx="4" fill="#ffffff" stroke="#9CA3AF" stroke-width="1.1"/>
    <text x="435" y="224">x1</text>
    <rect x="315" y="245" width="240" height="36" rx="4" fill="#ffffff" stroke="#9CA3AF" stroke-width="1.1"/>
    <text x="435" y="269">x2</text>
    <text x="435" y="305" font-size="14" fill="#9CA3AF">…</text>
    <rect x="315" y="320" width="240" height="36" rx="4" fill="#ffffff" stroke="#9CA3AF" stroke-width="1.1"/>
    <text x="435" y="344">x31</text>
  </g>

  <g text-anchor="middle">
    <rect x="35" y="170" width="95" height="40" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="82" y="196" font-size="12" fill="#0C447C">rs1 [4:0]</text>
    <rect x="35" y="320" width="95" height="40" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="82" y="346" font-size="12" fill="#0C447C">rs2 [4:0]</text>
    <rect x="180" y="165" width="80" height="50" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="220" y="195" font-size="12" font-weight="bold" fill="#7a4f00">32 选 1</text>
    <rect x="180" y="315" width="80" height="50" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="220" y="345" font-size="12" font-weight="bold" fill="#7a4f00">32 选 1</text>
    <rect x="640" y="175" width="95" height="40" rx="5" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.3"/>
    <text x="687" y="201" font-size="12" fill="#2d5c43">rdata1</text>
    <rect x="640" y="325" width="95" height="40" rx="5" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.3"/>
    <text x="687" y="351" font-size="12" fill="#2d5c43">rdata2</text>

    <rect x="35" y="405" width="95" height="40" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="82" y="431" font-size="12" fill="#0C447C">rd [4:0]</text>
    <rect x="180" y="400" width="80" height="50" rx="5" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.4"/>
    <text x="220" y="430" font-size="12" font-weight="bold" fill="#7a4f00">译码器</text>
    <rect x="640" y="400" width="120" height="40" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="700" y="426" font-size="12" fill="#0C447C">wdata [31:0]</text>
    <rect x="780" y="395" width="90" height="50" rx="5" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.3"/>
    <text x="825" y="417" font-size="11" fill="#7a2020">we / clk</text>
    <text x="825" y="434" font-size="11" fill="#7a2020">/ rst_n</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)">
    <line x1="130" y1="190" x2="178" y2="190"/>
    <line x1="130" y1="340" x2="178" y2="340"/>
    <line x1="260" y1="190" x2="313" y2="190"/>
    <line x1="260" y1="340" x2="313" y2="340"/>
    <line x1="555" y1="190" x2="638" y2="195"/>
    <line x1="555" y1="340" x2="638" y2="345"/>
    <line x1="130" y1="425" x2="178" y2="425"/>
    <line x1="260" y1="425" x2="313" y2="425"/>
    <line x1="760" y1="420" x2="558" y2="380"/>
  </g>
  <text x="35" y="105" font-size="11.5" fill="#5F5E5A">读地址</text>
  <text x="640" y="155" font-size="11.5" fill="#5F5E5A">读数据</text>
  <text x="35" y="390" font-size="11.5" fill="#5F5E5A">写地址</text>
  <text x="640" y="385" font-size="11.5" fill="#5F5E5A">写数据</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
