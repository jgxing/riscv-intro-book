<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 3-1　从 C 源程序到可执行程序</title>
  <desc>预处理、编译、汇编、链接、装载五个步骤，把 C 源程序依次变成预处理文件、汇编文本、目标文件、可执行文件，最后装入内存由处理器取指执行。</desc>
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 3-1　从 C 源程序到可执行程序</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">每一步的输入和输出都是文件，链接器负责把地址定下来</text>

  <g text-anchor="middle">
    <rect x="25" y="150" width="100" height="86" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="75" y="183" font-size="14" font-weight="bold" fill="#0C447C">main.c</text>
    <text x="75" y="210" font-size="11" fill="#3a3a38">C 源程序</text>

    <rect x="150" y="150" width="100" height="86" rx="7" fill="#EDECE8" stroke="#9CA3AF" stroke-width="1.3"/>
    <text x="200" y="183" font-size="14" font-weight="bold" fill="#3a3a38">main.i</text>
    <text x="200" y="210" font-size="11" fill="#5F5E5A">预处理结果</text>

    <rect x="275" y="150" width="100" height="86" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="325" y="183" font-size="14" font-weight="bold" fill="#0C447C">main.s</text>
    <text x="325" y="210" font-size="11" fill="#3a3a38">汇编文本</text>

    <rect x="400" y="150" width="100" height="86" rx="7" fill="#FDF2E4" stroke="#BA7517" stroke-width="1.3"/>
    <text x="450" y="183" font-size="14" font-weight="bold" fill="#7a4f00">main.o</text>
    <text x="450" y="210" font-size="11" fill="#3a3a38">目标文件</text>

    <rect x="525" y="150" width="100" height="86" rx="7" fill="#FCE8E6" stroke="#A32D2D" stroke-width="1.8"/>
    <text x="575" y="183" font-size="14" font-weight="bold" fill="#7a2020">main</text>
    <text x="575" y="210" font-size="11" fill="#3a3a38">可执行文件</text>

    <rect x="650" y="150" width="100" height="86" rx="7" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.3"/>
    <text x="700" y="183" font-size="14" font-weight="bold" fill="#2d5c43">内存</text>
    <text x="700" y="210" font-size="11" fill="#3a3a38">程序镜像</text>

    <rect x="775" y="150" width="100" height="86" rx="7" fill="#E7F3EC" stroke="#3B7A57" stroke-width="1.3"/>
    <text x="825" y="183" font-size="14" font-weight="bold" fill="#2d5c43">PC</text>
    <text x="825" y="210" font-size="11" fill="#3a3a38">从入口取指</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrowGray)">
    <line x1="126" y1="193" x2="148" y2="193"/>
    <line x1="251" y1="193" x2="273" y2="193"/>
    <line x1="376" y1="193" x2="398" y2="193"/>
    <line x1="501" y1="193" x2="523" y2="193"/>
    <line x1="626" y1="193" x2="648" y2="193"/>
    <line x1="751" y1="193" x2="773" y2="193"/>
  </g>
  <g font-size="10.5" fill="#5F5E5A" text-anchor="middle">
    <text x="137" y="142">预处理</text>
    <text x="262" y="142">编译</text>
    <text x="387" y="142">汇编</text>
    <text x="512" y="142">链接</text>
    <text x="637" y="142">装载</text>
    <text x="762" y="142">入口</text>
  </g>

  <rect x="25" y="280" width="410" height="94" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="45" y="308" font-size="14" font-weight="bold" fill="#7a4f00">目标文件 main.o</text>
  <text x="45" y="334" font-size="12" fill="#3a3a38">地址是相对的，不同文件的节可能从同一地址开始</text>
  <text x="45" y="356" font-size="12" fill="#3a3a38">可能含有未定义的符号引用，等待链接器解析</text>

  <rect x="465" y="280" width="410" height="94" rx="8" fill="#FAFAF8" stroke="#D3D1C8" stroke-width="1.2"/>
  <text x="485" y="308" font-size="14" font-weight="bold" fill="#7a2020">可执行文件 main</text>
  <text x="485" y="334" font-size="12" fill="#3a3a38">所有地址都是最终的，符号引用已经填好</text>
  <text x="485" y="356" font-size="12" fill="#3a3a38">有程序入口，装载器用它设置 PC</text>

  <text x="25" y="420" font-size="12.5" fill="#5F5E5A">RARS 把汇编和装载合成一步：装载汇编源文件后直接可以单步执行</text>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
