<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图 14-1　综合实验的五站</title>
  <desc>同一段程序依次经过编译、反汇编、模拟器验证、硬件仿真和 QEMU 运行，每一站都用同一个地址布局。</desc>
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 14-1　综合实验的五站</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">每站都能看到同样的结果：LED 写 55，串口输出 sum=55</text>

  <!-- 五个阶段 -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="105" width="160" height="86" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="110" y="133" font-size="13" font-weight="bold" fill="#92400E">1 编译</text>
    <text x="110" y="155" fill="#1f2937">gcc + 链接脚本</text>
    <text x="110" y="175" font-size="10.5" fill="#B45309">program.elf</text>

    <rect x="222" y="105" width="160" height="86" rx="8" fill="#DBEAFE" stroke="#185FA5" stroke-width="1.5"/>
    <text x="302" y="133" font-size="13" font-weight="bold" fill="#0B3D6E">2 反汇编</text>
    <text x="302" y="155" fill="#1f2937">objdump -d</text>
    <text x="302" y="175" font-size="10.5" fill="#185FA5">program.dump</text>

    <rect x="414" y="105" width="160" height="86" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
    <text x="494" y="133" font-size="13" font-weight="bold" fill="#065F46">3 模拟器</text>
    <text x="494" y="155" fill="#1f2937">Python 逐条执行</text>
    <text x="494" y="175" font-size="10.5" fill="#047857">看寄存器变化</text>

    <rect x="606" y="105" width="160" height="86" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="686" y="133" font-size="13" font-weight="bold" fill="#6B21A8">4 硬件仿真</text>
    <text x="686" y="155" fill="#1f2937">iverilog + 单周期核</text>
    <text x="686" y="175" font-size="10.5" fill="#7C3AED">code.hex</text>

    <rect x="798" y="105" width="132" height="86" rx="8" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.5"/>
    <text x="864" y="133" font-size="13" font-weight="bold" fill="#9F1239">5 QEMU</text>
    <text x="864" y="155" fill="#1f2937">裸机运行</text>
    <text x="864" y="175" font-size="10.5" fill="#BE123C">串口输出</text>
  </g>

  <g stroke="#6B7280" stroke-width="2" marker-end="url(#arr)">
    <path d="M192 148 L220 148"/>
    <path d="M384 148 L412 148"/>
    <path d="M576 148 L604 148"/>
    <path d="M768 148 L796 148"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 统一布局 -->
  <rect x="30" y="235" width="900" height="150" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/>
  <text x="50" y="262" font-size="13" font-weight="bold" fill="#374151">贯穿五站的那张地址表</text>
  <g font-size="11.5" font-family="monospace" fill="#1f2937">
    <text x="50" y="292">代码段</text><text x="220" y="292">0x00400000</text>
    <text x="50" y="316">数据段</text><text x="220" y="316">0x10000000</text>
    <text x="50" y="340">LED</text><text x="220" y="340">0xffff0010</text>
    <text x="50" y="364">UART</text><text x="220" y="364">0xffff0030</text>
  </g>
  <g font-size="11.5" fill="#374151">
    <text x="430" y="292">ELF 里的段地址来自链接脚本</text>
    <text x="430" y="316">模拟器的内存模型照这个布局建</text>
    <text x="430" y="340">硬件的总线译码照这个布局接</text>
    <text x="430" y="364">QEMU 那版换成自己的 virt 布局</text>
  </g>
  <text x="30" y="418" font-size="12" fill="#6B7280">注：第 5 站用的是 QEMU virt 的地址，前三站沿用本书自己的布局；地址可以换，方法不变。</text>
</svg>
